<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ApoloXia · Bienvenido</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        :root {
            --pure-black: #000000; --bg-dark: #0a0a0a; --bg-card: #141414; --border-gray: #2a2a2a;
            --text-primary: #ffffff; --text-secondary: #b0b0b0; --text-muted: #555555;
            --accent-blue: #4f9eff; --accent-blue-dark: #3b82f6; --accent-blue-glow: rgba(79,158,255,0.15);
            --accent-cyan: #22d3ee; --accent-violet: #a78bfa;
            --accent-gray: #888888; --accent-gray-light: #aaaaaa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: 'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background: var(--pure-black); height: 100vh; overflow: hidden; color: var(--text-primary); }

        /* ═══════════════════════════════════════════════════
           SPLASH SCREEN MEJORADO — Más brillante y cinematográfico
           ═══════════════════════════════════════════════════ */
        .splash-screen {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
            transition: opacity 0.9s ease, transform 0.9s ease;
            overflow: hidden;
        }
        .splash-screen.hidden { opacity: 0; transform: scale(1.15); pointer-events: none; }

        /* Fondo con aurora y partículas brillantes */
        .splash-screen::before {
            content: '';
            position: absolute; inset: -50%;
            background:
                radial-gradient(circle at 50% 50%, rgba(79,158,255,0.25) 0%, transparent 40%),
                radial-gradient(circle at 20% 30%, rgba(34,211,238,0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(167,139,250,0.18) 0%, transparent 45%);
            animation: auroraMove 8s ease-in-out infinite alternate;
            filter: blur(60px);
            z-index: 0;
        }
        @keyframes auroraMove {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            50%  { transform: translate(-6%, 4%) rotate(2deg) scale(1.08); }
            100% { transform: translate(6%, -4%) rotate(-2deg) scale(1); }
        }

        /* Grid de puntos brillantes */
        .splash-screen::after {
            content: '';
            position: absolute; inset: 0;
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.35) 1px, transparent 1px),
                radial-gradient(circle, rgba(79,158,255,0.5) 1px, transparent 1px);
            background-size: 60px 60px, 120px 120px;
            background-position: 0 0, 30px 30px;
            opacity: 0.25;
            animation: gridDrift 20s linear infinite;
            z-index: 1;
        }
        @keyframes gridDrift {
            from { background-position: 0 0, 30px 30px; }
            to   { background-position: 60px 60px, 90px 90px; }
        }

        /* Contenido del splash por encima */
        .splash-content {
            position: relative;
            z-index: 3;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* LOGO con brillo intenso y barrido de luz */
        .splash-logo-wrap {
            position: relative;
            width: 160px; height: 160px;
            margin-bottom: 2.5rem;
            display: flex; align-items: center; justify-content: center;
        }
        .splash-logo-wrap::before {
            content: '';
            position: absolute; inset: -30px;
            background: radial-gradient(circle, rgba(79,158,255,0.6) 0%, rgba(79,158,255,0.15) 35%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            animation: haloPulse 2.5s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes haloPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50%      { transform: scale(1.25); opacity: 1; }
        }

        .splash-logo {
            width: 140px; height: 140px;
            background: linear-gradient(135deg, #4f9eff 0%, #3b82f6 50%, #22d3ee 100%);
            border-radius: 32px;
            display: flex; align-items: center; justify-content: center;
            font-size: 5rem; font-weight: 900; color: #000;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 60px rgba(79,158,255,0.9),
                0 0 120px rgba(79,158,255,0.7),
                0 0 200px rgba(79,158,255,0.5),
                0 0 300px rgba(34,211,238,0.3),
                inset 0 0 40px rgba(255,255,255,0.4),
                inset 0 -10px 30px rgba(0,0,0,0.3);
            animation: logoFloat 3.5s ease-in-out infinite, megaGlow 2s ease-in-out infinite alternate;
        }
        /* Barrido de luz diagonal sobre el logo */
        .splash-logo::before {
            content: '';
            position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(115deg,
                transparent 30%,
                rgba(255,255,255,0.75) 48%,
                rgba(255,255,255,0.95) 50%,
                rgba(255,255,255,0.75) 52%,
                transparent 70%);
            transform: rotate(0deg);
            animation: logoShine 3.5s ease-in-out infinite;
        }
        @keyframes logoShine {
            0%   { transform: translateX(-120%) rotate(0deg); }
            60%  { transform: translateX(120%) rotate(0deg); }
            100% { transform: translateX(120%) rotate(0deg); }
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-14px) rotate(-1deg); }
        }
        @keyframes megaGlow {
            0% {
                box-shadow:
                    0 0 60px rgba(79,158,255,0.9),
                    0 0 120px rgba(79,158,255,0.7),
                    0 0 200px rgba(79,158,255,0.5),
                    0 0 300px rgba(34,211,238,0.3),
                    inset 0 0 40px rgba(255,255,255,0.4),
                    inset 0 -10px 30px rgba(0,0,0,0.3);
            }
            100% {
                box-shadow:
                    0 0 100px rgba(79,158,255,1),
                    0 0 200px rgba(79,158,255,0.85),
                    0 0 320px rgba(79,158,255,0.6),
                    0 0 450px rgba(34,211,238,0.5),
                    inset 0 0 60px rgba(255,255,255,0.6),
                    inset 0 -10px 30px rgba(0,0,0,0.3);
            }
        }

        /* TÍTULO con shimmer */
        .splash-title {
            font-size: 3.5rem; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 0.75rem;
            background: linear-gradient(90deg, #ffffff 0%, #4f9eff 25%, #ffffff 50%, #22d3ee 75%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            animation: titleShimmer 4s linear infinite;
            text-shadow: 0 0 40px rgba(79,158,255,0.5);
            position: relative;
        }
        @keyframes titleShimmer {
            0%   { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Subtítulo con destello y línea decorativa */
        .splash-subtitle {
            font-size: 0.95rem; color: var(--text-secondary); font-weight: 500;
            letter-spacing: 0.55em; text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
            position: relative;
            padding: 0 0.5em;
        }
        .splash-subtitle::before,
        .splash-subtitle::after {
            content: '';
            position: absolute; top: 50%;
            width: 60px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            box-shadow: 0 0 8px var(--accent-blue);
        }
        .splash-subtitle::before { right: 100%; margin-right: 1rem; }
        .splash-subtitle::after  { left: 100%; margin-left: 1rem; }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50%      { opacity: 1; text-shadow: 0 0 12px rgba(79,158,255,0.7); }
        }

        /* Línea de progreso brillante */
        .splash-progress {
            margin-top: 3rem;
            width: 220px; height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .splash-progress::before {
            content: '';
            position: absolute; top: 0; left: 0;
            height: 100%; width: 40%;
            background: linear-gradient(90deg, transparent, #4f9eff, #22d3ee, #4f9eff, transparent);
            box-shadow: 0 0 15px rgba(79,158,255,0.9);
            border-radius: 2px;
            animation: progressSweep 1.8s ease-in-out infinite;
        }
        @keyframes progressSweep {
            0%   { left: -40%; }
            100% { left: 100%; }
        }

        /* Partículas flotantes */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(79,158,255,0.9) 0%, rgba(79,158,255,0) 70%);
            pointer-events: none;
            animation: particleFloat linear infinite;
            z-index: 2;
        }
        @keyframes particleFloat {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }

        /* ═══════════ LOGIN ═══════════ */
        .login-screen { position: fixed; inset: 0; background: var(--pure-black); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 900; opacity: 0; transition: opacity 0.8s ease; }
        .login-screen.active { display: flex; opacity: 1; }
        .login-container { width: 100%; max-width: 420px; padding: 2rem; text-align: center; }
        .login-logo { width: 80px; height: 80px; background: linear-gradient(135deg,#4f9eff 0%,#3b82f6 100%); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 900; color: var(--pure-black); margin: 0 auto 2rem; box-shadow: 0 0 40px rgba(79,158,255,0.6), 0 0 80px rgba(79,158,255,0.4), inset 0 0 20px rgba(255,255,255,0.3); animation: glowPulse 2s ease-in-out infinite alternate; }
        @keyframes glowPulse { 0%{box-shadow:0 0 40px rgba(79,158,255,.6),0 0 80px rgba(79,158,255,.4),inset 0 0 20px rgba(255,255,255,.3)} 100%{box-shadow:0 0 70px rgba(79,158,255,.9),0 0 140px rgba(79,158,255,.7),inset 0 0 30px rgba(255,255,255,.5)} }
        .login-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .login-subtitle { font-size: 0.9375rem; color: var(--text-secondary); margin-bottom: 2.5rem; font-weight: 500; }
        .input-group { position: relative; margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--accent-blue); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .input-group input { width: 100%; padding: 1.25rem 1.5rem; background: rgba(255,255,255,0.05); border: 2px solid var(--border-gray); border-radius: 16px; color: var(--text-primary); font-size: 1.1rem; font-family: inherit; outline: none; transition: all 0.3s ease; }
        .input-group input:focus { border-color: var(--accent-blue); box-shadow: 0 0 30px rgba(79,158,255,0.3); background: rgba(255,255,255,0.08); }
        .input-group input::placeholder { color: var(--text-muted); }
        .login-btn { width: 100%; padding: 1.25rem 1.5rem; background: linear-gradient(135deg,#4f9eff 0%,#3b82f6 100%); border: none; border-radius: 16px; color: var(--pure-black); font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 1rem; position: relative; overflow: hidden; }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 50px rgba(79,158,255,0.5); }
        .login-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition: left 0.6s ease; }
        .login-btn:hover::before { left: 100%; }

        /* ═══════════ INTERFACE ═══════════ */
        .interface-screen { position: fixed; inset: 0; background: var(--pure-black); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 800; opacity: 0; transition: opacity 0.8s ease; }
        .interface-screen.active { display: flex; opacity: 1; }
        .interface-content { text-align: center; padding: 2rem; max-width: 700px; }
        .interface-logo { width: 100px; height: 100px; background: linear-gradient(135deg,#4f9eff 0%,#3b82f6 100%); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 900; color: var(--pure-black); margin: 0 auto 2rem; box-shadow: 0 0 50px rgba(79,158,255,0.7), 0 0 100px rgba(79,158,255,0.5), 0 0 150px rgba(79,158,255,0.3), inset 0 0 30px rgba(255,255,255,0.3); animation: interfaceGlow 2s ease-in-out infinite alternate; }
        @keyframes interfaceGlow { 0%{box-shadow:0 0 50px rgba(79,158,255,.7),0 0 100px rgba(79,158,255,.5),0 0 150px rgba(79,158,255,.3),inset 0 0 30px rgba(255,255,255,.3)} 100%{box-shadow:0 0 80px rgba(79,158,255,.9),0 0 160px rgba(79,158,255,.7),0 0 240px rgba(79,158,255,.5),inset 0 0 50px rgba(255,255,255,.5)} }
        .welcome-message { font-size: 1.5rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; }
        .user-name { font-size: 2.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: 3rem; word-break: break-all; }
        .buttons-container { display: flex; flex-direction: column; gap: 1.2rem; align-items: center; margin-bottom: 3rem; }
        .access-btn { display: inline-flex; align-items: center; justify-content: center; gap: 1rem; padding: 1.2rem 2.5rem; background: var(--bg-card); border: 1px solid var(--border-gray); border-radius: 20px; color: var(--text-secondary); font-size: 1.15rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.05em; position: relative; overflow: hidden; width: 100%; max-width: 380px; background: linear-gradient(135deg,#0a0a0a,#141414); }
        .access-btn.chat-btn { border-color: var(--accent-blue); color: var(--accent-blue); box-shadow: 0 5px 20px rgba(79,158,255,0.1); }
        .access-btn.chat-btn:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 15px 40px rgba(79,158,255,0.4); background: linear-gradient(135deg,#1a1a2e,#0a1a2e); border-color: var(--accent-blue); color: #fff; }
        .access-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); transition: left 0.6s ease; }
        .access-btn:hover::before { left: 100%; }
        .access-btn svg { width: 24px; height: 24px; stroke-width: 2; stroke: currentColor; fill: none; }
        .logout-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: transparent; border: 1px solid var(--border-gray); border-radius: 12px; color: var(--text-secondary); font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .logout-btn:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.1); }
        .copyright { font-size: 0.875rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1.5rem; }

        @media (max-width: 480px) {
            .splash-logo-wrap { width: 130px; height: 130px; }
            .splash-logo { width: 110px; height: 110px; font-size: 4rem; }
            .splash-title { font-size: 2.5rem; }
            .splash-subtitle { font-size: 0.75rem; letter-spacing: 0.35em; }
            .splash-subtitle::before, .splash-subtitle::after { width: 30px; }
            .login-container{padding:1.5rem}
            .user-name{font-size:1.8rem}
            .access-btn{padding:1rem 1.8rem;font-size:1rem;max-width:300px}
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <!-- Partículas flotantes (se generan con JS) -->
        <div id="particles"></div>

        <div class="splash-content">
            <div class="splash-logo-wrap">
                <div class="splash-logo">A</div>
            </div>
            <h1 class="splash-title">Apolo<span>Xia</span></h1>
            <p class="splash-subtitle">Premium</p>
            <div class="splash-progress"></div>
        </div>
    </div>

    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <div class="login-logo">A</div>
            <h2 class="login-title">Acceso</h2>
            <p class="login-subtitle">Ingresa tu correo para continuar</p>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="nombre@correo.com" required autocomplete="email">
                </div>
                <button type="submit" class="login-btn">Ingresar →</button>
            </form>
        </div>
    </div>

    <div class="interface-screen" id="interfaceScreen">
        <div class="interface-content">
            <div class="interface-logo">A</div>
            <p class="welcome-message">Bienvenido</p>
            <p class="user-name" id="userNameDisplay">Usuario</p>
            <div class="buttons-container">
                <!-- ÚNICO BOTÓN: Agente IA Apolo (todo integrado) -->
                <button class="access-btn chat-btn" onclick="accessAgent()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    Agente IA Apolo
                </button>
            </div>
            <button class="logout-btn" onclick="logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Cerrar sesión
            </button>
            <p class="copyright">Derechos reservados — Panamá 2026</p>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════
        // PARTÍCULAS FLOTANTES BRILLANTES
        // ═══════════════════════════════════════════════════
        (function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;
            const colors = [
                'rgba(79,158,255,0.9)',
                'rgba(34,211,238,0.85)',
                'rgba(167,139,250,0.8)',
                'rgba(255,255,255,0.7)'
            ];
            const count = 22;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 6 + 2;
                const left = Math.random() * 100;
                const dur = Math.random() * 8 + 6;
                const delay = Math.random() * 6;
                const color = colors[Math.floor(Math.random() * colors.length)];
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = left + '%';
                p.style.bottom = '-10px';
                p.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
                p.style.animationDuration = dur + 's';
                p.style.animationDelay = delay + 's';
                p.style.opacity = Math.random() * 0.6 + 0.4;
                container.appendChild(p);
            }
        })();

        // ═══════════════════════════════════════════════════
        // LÓGICA DE NAVEGACIÓN (intacta)
        // ═══════════════════════════════════════════════════
        let userEmail = '';
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('apoloxia_session_email');
            if (savedEmail) {
                userEmail = savedEmail;
                document.getElementById('splashScreen').style.display = 'none';
                showInterface(savedEmail);
            } else {
                setTimeout(() => { showLoginScreen(); }, 3200);
            }
        });
        function showLoginScreen() {
            const splash = document.getElementById('splashScreen');
            const login = document.getElementById('loginScreen');
            splash.classList.add('hidden');
            setTimeout(() => {
                splash.style.display = 'none';
                login.style.display = 'flex';
                void login.offsetWidth;
                login.classList.add('active');
                setTimeout(() => { document.getElementById('email').focus(); }, 100);
            }, 900);
        }
        function handleLogin(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email');
            userEmail = emailInput.value.trim().toLowerCase();
            if (userEmail && userEmail.includes('@')) {
                localStorage.setItem('apoloxia_session_email', userEmail);
                const login = document.getElementById('loginScreen');
                login.classList.remove('active');
                setTimeout(() => { login.style.display = 'none'; showInterface(userEmail); }, 800);
            } else {
                alert('Por favor ingresa un email válido');
            }
        }
        function showInterface(email) {
            const interfaceDiv = document.getElementById('interfaceScreen');
            const userNameDisplay = document.getElementById('userNameDisplay');
            userNameDisplay.textContent = email.split('@')[0];
            interfaceDiv.style.display = 'flex';
            void interfaceDiv.offsetWidth;
            interfaceDiv.classList.add('active');
        }
        function accessAgent() { window.location.href = 'chat.html'; }
        function logout() {
            localStorage.removeItem('apoloxia_session_email');
            localStorage.removeItem('apoloxia_user_email');
            localStorage.removeItem('code_conversation_id');
            window.location.reload();
        }
        document.getElementById('email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin(e);
        });
    </script>
</body>
</html>
