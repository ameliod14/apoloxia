<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ApoloXia · Chat IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        :root {
            --bg-primary: #05060d;
            --bg-secondary: rgba(18, 22, 40, 0.62);
            --bg-sidebar: rgba(7, 9, 20, 0.72);
            --border-light: rgba(120, 160, 255, 0.16);
            --text-primary: #f2f6ff;
            --text-secondary: #aab4d4;
            --text-muted: #6b7599;
            --accent-blue: #00e5ff;
            --accent-blue-dark: #7c3aed;
            --accent-pink: #ff2bd6;
            --accent-gray: #8a95bd;
            --hover-gray: rgba(60, 80, 160, 0.28);
            --glow: 0 0 24px rgba(0, 229, 255, 0.35);
            --glass-blur: blur(18px) saturate(140%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(1200px 700px at 70% -10%, #121a46 0%, transparent 60%),
                        radial-gradient(900px 600px at -10% 110%, #2a0f4d 0%, transparent 60%),
                        var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        #bg3d {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .grid-floor {
            position: fixed;
            left: -50%;
            bottom: -35vh;
            width: 200%;
            height: 70vh;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0,229,255,0.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,58,237,0.22) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(500px) rotateX(68deg);
            animation: gridMove 6s linear infinite;
            -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%);
            mask-image: linear-gradient(to top, #000 10%, transparent 85%);
            opacity: 0.55;
        }
        @keyframes gridMove { to { background-position: 0 60px, 60px 0; } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--accent-blue), var(--accent-blue-dark)); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-pink); }

        .app { display: flex; height: 100vh; width: 100vw; position: relative; z-index: 1; perspective: 1600px; }

        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border-light);
            box-shadow: 8px 0 40px rgba(0, 0, 0, 0.5), inset -1px 0 0 rgba(0,229,255,0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark) 60%, var(--accent-pink));
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 22px rgba(0, 229, 255, 0.55), 0 6px 0 rgba(60, 20, 120, 0.7), inset 0 2px 0 rgba(255,255,255,0.35);
            transform: rotateX(18deg) rotateY(-18deg);
            animation: logoFloat 4s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%, 100% { transform: rotateX(18deg) rotateY(-18deg) translateY(0); }
            50% { transform: rotateX(-10deg) rotateY(18deg) translateY(-3px); }
        }

        .sidebar-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-primary);
        }
        .sidebar-brand span {
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .new-chat-btn {
            margin: 16px 16px 8px;
            padding: 12px 18px;
            background: linear-gradient(135deg, rgba(0,229,255,0.12), rgba(124,58,237,0.18));
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s;
            box-shadow: 0 5px 0 rgba(10, 14, 40, 0.8), 0 10px 20px rgba(0,0,0,0.35);
            transform: translateZ(0);
        }
        .new-chat-btn:hover {
            color: #fff;
            border-color: var(--accent-blue);
            box-shadow: 0 5px 0 rgba(10, 14, 40, 0.8), 0 0 24px rgba(0,229,255,0.4);
            transform: translateY(-2px);
        }
        .new-chat-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(10,14,40,0.8); }

        .sidebar-section-title {
            padding: 16px 20px 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.22em;
            opacity: 0.85;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
            perspective: 800px;
        }

        .conversation-item {
            padding: 10px 14px;
            margin: 4px 0;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s;
            border: 1px solid transparent;
            transform-origin: left center;
        }
        .conversation-item:hover {
            background: var(--bg-secondary);
            border-color: var(--border-light);
            transform: translateZ(14px) rotateY(-6deg) translateX(3px);
        }
        .conversation-item.active {
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.14), rgba(124, 58, 237, 0.1));
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0,229,255,0.18), inset 0 0 14px rgba(0,229,255,0.06);
        }
        .conversation-item.active .conv-title { color: var(--accent-blue); }

        .conv-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
            border: 1px solid var(--border-light);
        }

        .conv-info { flex: 1; min-width: 0; }
        .conv-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .conv-delete {
            opacity: 0;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .conversation-item:hover .conv-delete { opacity: 1; }
        .conv-delete:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-light);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid var(--border-light);
        }
        .user-profile:hover {
            background: var(--hover-gray);
            border-color: var(--accent-blue);
            box-shadow: var(--glow);
            transform: translateY(-2px);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: conic-gradient(from 180deg, var(--accent-blue), var(--accent-blue-dark), var(--accent-pink), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 14px rgba(0,229,255,0.45);
        }

        .user-info { flex: 1; min-width: 0; }
        .user-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-tier {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent-blue);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
            min-width: 0;
        }

        .chat-header {
            height: 60px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(6, 8, 20, 0.55);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            z-index: 10;
            box-shadow: 0 1px 0 rgba(0,229,255,0.12), 0 10px 30px rgba(0,0,0,0.3);
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
        }
        .menu-toggle:hover { background: var(--bg-secondary); }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .header-btn {
            padding: 7px 13px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            box-shadow: 0 3px 0 rgba(8, 10, 30, 0.9);
        }
        .header-btn:hover {
            background: var(--hover-gray);
            color: var(--text-primary);
            border-color: var(--accent-blue);
            transform: translateY(-1px);
        }
        .header-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(8,10,30,0.9); }
        .header-btn.active {
            background: rgba(0, 229, 255, 0.14);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 3px 0 rgba(8,10,30,0.9), 0 0 18px rgba(0,229,255,0.4);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            perspective: 1200px;
        }

        .messages-wrapper {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .welcome-banner {
            text-align: center;
            padding: 40px 20px 30px;
            animation: fadeInUp 0.7s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) rotateX(-12deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        .welcome-icon {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 26px;
            perspective: 700px;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            position: relative;
        }
        .welcome-icon::after {
            content: "";
            position: absolute;
            bottom: -18px;
            left: 50%;
            width: 80px;
            height: 16px;
            transform: translateX(-50%);
            background: radial-gradient(ellipse, rgba(0,229,255,0.55), transparent 70%);
            filter: blur(4px);
            animation: shadowPulse 6s ease-in-out infinite;
        }
        @keyframes shadowPulse { 0%,100% { opacity: .9; transform: translateX(-50%) scale(1); } 50% { opacity: .5; transform: translateX(-50%) scale(.7); } }

        .cube {
            width: 64px;
            height: 64px;
            position: relative;
            transform-style: preserve-3d;
            animation: cubeSpin 10s linear infinite;
        }
        @keyframes cubeSpin {
            from { transform: rotateX(-24deg) rotateY(0deg); }
            to { transform: rotateX(-24deg) rotateY(360deg); }
        }
        .cube .face {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--accent-blue);
            background: linear-gradient(135deg, rgba(0,229,255,0.16), rgba(124,58,237,0.28));
            box-shadow: inset 0 0 22px rgba(0,229,255,0.35), 0 0 16px rgba(0,229,255,0.25);
            font-size: 1.8rem;
            backface-visibility: visible;
        }
        .cube .f1 { transform: translateZ(32px); }
        .cube .f2 { transform: rotateY(90deg) translateZ(32px); }
        .cube .f3 { transform: rotateY(180deg) translateZ(32px); }
        .cube .f4 { transform: rotateY(-90deg) translateZ(32px); }
        .cube .f5 { transform: rotateX(90deg) translateZ(32px); }
        .cube .f6 { transform: rotateX(-90deg) translateZ(32px); }

        .welcome-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.04em;
            text-shadow: 0 0 30px rgba(0,229,255,0.25);
        }
        .welcome-title .highlight {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark), var(--accent-pink));
            background-size: 200% 200%;
            animation: hueShift 6s ease infinite;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @keyframes hueShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .welcome-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            max-width: 680px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .quick-action {
            padding: 18px;
            background: linear-gradient(145deg, rgba(24, 30, 60, 0.7), rgba(10, 12, 30, 0.7));
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.15s ease-out, border-color 0.3s, box-shadow 0.3s;
            transform-style: preserve-3d;
            will-change: transform;
            position: relative;
            overflow: hidden;
        }
        .quick-action::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(0,229,255,0.2), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .quick-action:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 30px rgba(0,229,255,0.28);
        }
        .quick-action:hover::before { opacity: 1; }

        .quick-action-icon { font-size: 1.7rem; margin-bottom: 8px; transform: translateZ(30px); display: inline-block; filter: drop-shadow(0 6px 10px rgba(0,229,255,0.4)); }
        .quick-action-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            transform: translateZ(20px);
        }
        .quick-action-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            transform: translateZ(12px);
        }

        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 24px;
            animation: msgIn 0.45s cubic-bezier(.2,.8,.2,1);
        }
        .message.user { flex-direction: row-reverse; }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(18px) rotateX(-14deg) scale(.97); }
            to { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .message.user .message-avatar {
            background: conic-gradient(from 180deg, var(--accent-blue), var(--accent-blue-dark), var(--accent-pink), var(--accent-blue));
            color: #fff;
            box-shadow: 0 0 16px rgba(0,229,255,0.45);
        }
        .message.assistant .message-avatar {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 16px rgba(0,229,255,0.3), inset 0 0 10px rgba(0,229,255,0.15);
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, rgba(0,229,255,0.16), rgba(124,58,237,0.26));
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(0,229,255,0.35);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 20px rgba(0,229,255,0.12);
        }
        .message.assistant .message-content {
            background: rgba(8, 11, 26, 0.55);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 14px 18px;
            border-radius: 6px 18px 18px 18px;
            max-width: 100%;
            box-shadow: 0 14px 40px rgba(0,0,0,0.4);
        }
        .message.assistant .message-body {
            flex: 1;
            max-width: 100%;
            min-width: 0;
        }

        .message.assistant .message-content h1,
        .message.assistant .message-content h2,
        .message.assistant .message-content h3,
        .message.assistant .message-content h4 {
            margin: 24px 0 12px 0;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }
        .message.assistant .message-content h1 { font-size: 1.5rem; border-bottom: 1px solid var(--border-light); padding-bottom: 8px; }
        .message.assistant .message-content h2 { font-size: 1.25rem; color: var(--accent-blue); text-shadow: 0 0 14px rgba(0,229,255,0.35); }
        .message.assistant .message-content h3 { font-size: 1.1rem; color: #d6defa; }
        .message.assistant .message-content h4 { font-size: 1rem; color: #c0c8e6; }

        .message.assistant .message-content p {
            margin-bottom: 16px;
            line-height: 1.8;
            color: #c8d0ec;
            font-size: 0.96rem;
            letter-spacing: 0.1px;
            text-align: left;
        }
        .message.assistant .message-content > p:first-of-type {
            font-size: 1rem;
            color: #e0e6fb;
        }

        .emoji-big {
            font-size: 1.3em;
            vertical-align: -3px;
            display: inline-block;
            line-height: 1;
        }

        .message.assistant .message-content ul, .message.assistant .message-content ol {
            margin: 12px 0 16px 24px;
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .message.assistant .message-content li {
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .message.assistant .message-content li::marker { color: var(--accent-blue); }

        .message.assistant .message-content strong {
            color: var(--text-primary);
            font-weight: 700;
        }
        .message.assistant .message-content em {
            color: #d6defa;
            font-style: italic;
        }
        .message.assistant .message-content mark {
            background: rgba(255, 43, 214, 0.18);
            color: #ff7be9;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .message.assistant .message-content a {
            color: var(--accent-blue);
            text-decoration: none;
            border-bottom: 1px dashed rgba(0, 229, 255, 0.5);
            transition: all 0.2s;
        }
        .message.assistant .message-content a:hover {
            color: #fff;
            border-bottom-style: solid;
            border-bottom-color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue);
        }

        .message.assistant .message-content blockquote {
            border-left: 3px solid var(--accent-blue);
            padding: 12px 18px;
            margin: 16px 0;
            background: rgba(0,229,255,0.06);

                        <span class="search-engines-label" style="margin-left:8px;">🔍 Tavily · Exa AI · MediaStack</span>

<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings(event)">

        <div class="settings-header">

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                    🗑️ Borrar todas
                </button>

                    🚪 Cerrar sesión
                </button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
    const API_BASE_URL = '';
    let state = {
        userEmail: '',
        userName: '',
        userTier: 'free',
        remainingDaily: 100,
        maxDaily: 100,
        conversationId: null,
        conversations: [],
        currentModelId: null,
        currentAgentId: 'general',
        webSearchEnabled: false,
        multiAgentEnabled: false,
        isTyping: false,
        availableModels: [],
        availableAgents: [],
        uploadedFile: null
    };
    let MODELS_CATALOG = {};

    function getLocalStorageKey(email, convId) { return `apoloxia_messages_${email}_${convId}`; }
    function getConversationsKey(email) { return `apoloxia_conversations_${email}`; }
    function saveMessagesToLocal(email, convId, messages) {
        if (!convId) return;
        localStorage.setItem(getLocalStorageKey(email, convId), JSON.stringify(messages));
    }
    function getMessagesFromLocal(email, convId) {
        if (!convId) return [];
        const data = localStorage.getItem(getLocalStorageKey(email, convId));
        return data ? JSON.parse(data) : [];
    }
    function saveConversationsToLocal(email, conversations) {
        localStorage.setItem(getConversationsKey(email), JSON.stringify(conversations));
    }
    function getConversationsFromLocal(email) {
        const data = localStorage.getItem(getConversationsKey(email));
        return data ? JSON.parse(data) : [];
    }
    function deleteConversationFromLocal(email, convId) {
        localStorage.removeItem(getLocalStorageKey(email, convId));
        let convs = getConversationsFromLocal(email);
        convs = convs.filter(c => c.conversation_id !== convId);
        saveConversationsToLocal(email, convs);
    }
    function updateConversationListLocal(email, convId, lastMessage) {
        let convs = getConversationsFromLocal(email);
        const existing = convs.find(c => c.conversation_id === convId);
        const now = new Date().toISOString();
        if (existing) {
            existing.last_access = now;
            existing.last_message = lastMessage;
        } else {
            convs.push({ conversation_id: convId, last_access: now, last_message: lastMessage, message_count: 0 });
        }
        saveConversationsToLocal(email, convs);
        return convs;
    }

    const CALLOUT_TYPES = {
        "tip": { icon: "💡", label: "TIP", cls: "tip" },
        "consejo": { icon: "💡", label: "CONSEJO", cls: "tip" },
        "nota": { icon: "📌", label: "NOTA", cls: "note" },
        "note": { icon: "📌", label: "NOTE", cls: "note" },
        "importante": { icon: "⚡", label: "IMPORTANTE", cls: "important" },
        "important": { icon: "⚡", label: "IMPORTANT", cls: "important" },
        "advertencia": { icon: "⚠️", label: "ADVERTENCIA", cls: "warning" },
        "warning": { icon: "⚠️", label: "WARNING", cls: "warning" },
        "peligro": { icon: "🚨", label: "PELIGRO", cls: "danger" },
        "danger": { icon: "🚨", label: "DANGER", cls: "danger" },
        "error": { icon: "❌", label: "ERROR", cls: "error" },
        "éxito": { icon: "✅", label: "ÉXITO", cls: "success" },
        "exito": { icon: "✅", label: "ÉXITO", cls: "success" },
        "success": { icon: "✅", label: "SUCCESS", cls: "success" },
        "info": { icon: "ℹ️", label: "INFO", cls: "info" },
        "información": { icon: "ℹ️", label: "INFO", cls: "info" },
        "pregunta": { icon: "❓", label: "PREGUNTA", cls: "question" },
        "question": { icon: "❓", label: "QUESTION", cls: "question" },
        "cita": { icon: "💬", label: "CITA", cls: "quote" },
        "quote": { icon: "💬", label: "QUOTE", cls: "quote" },
        "alerta": { icon: "⚠️", label: "ALERTA", cls: "warning" },
        "check": { icon: "✅", label: "CHECK", cls: "success" }
    };

    const EMOJI_TO_TYPE = {
        "💡": "tip", "📌": "note", "⚡": "important", "⚠️": "warning",
        "🚨": "danger", "❌": "error", "✅": "success", "ℹ️": "info",
        "❓": "question", "💬": "quote", "🔔": "warning", "🎯": "important"
    };

    function processCallouts(container) {
        container.querySelectorAll('blockquote').forEach(bq => {
            const text = bq.textContent.trim();
            let type = null, title = null, body = null;

            const ghMatch = text.match(/^\[!(\w+)\]\s*([\s\S]*)$/);
            if (ghMatch) {
                const key = ghMatch[1].toLowerCase();
                if (CALLOUT_TYPES[key]) {
                    type = CALLOUT_TYPES[key].cls;
                    title = CALLOUT_TYPES[key].label;
                    body = ghMatch[2];
                }
            }

            if (!type) {
                const emojiMatch = text.match(/^([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]+)\s*\*\*([^*]+?):?\*\*\s*([\s\S]*)$/u);
                if (emojiMatch) {
                    const emoji = emojiMatch[1].trim();
                    const label = emojiMatch[2].trim().toUpperCase();
                    body = emojiMatch[3];
                    if (EMOJI_TO_TYPE[emoji]) type = EMOJI_TO_TYPE[emoji];
                    else {
                        const lblLower = label.toLowerCase().replace(/[^a-záéíóúñ]/g, '');
                        if (CALLOUT_TYPES[lblLower]) type = CALLOUT_TYPES[lblLower].cls;
                    }
                    title = label;
                    if (!type) type = "note";
                }
            }

            if (!type) {
                const boldMatch = text.match(/^\*\*([^*]+?):\*\*\s*([\s\S]*)$/);
                if (boldMatch) {
                    const label = boldMatch[1].trim();
                    const lblLower = label.toLowerCase().replace(/[^a-záéíóúñ]/g, '');
                    if (CALLOUT_TYPES[lblLower]) {
                        type = CALLOUT_TYPES[lblLower].cls;
                        title = CALLOUT_TYPES[lblLower].label;
                        body = boldMatch[2];
                    }
                }
            }

            if (type) {
                const icon = CALLOUT_TYPES[Object.keys(CALLOUT_TYPES).find(k => CALLOUT_TYPES[k].cls === type)]?.icon || "💡";
                const callout = document.createElement('div');
                callout.className = `callout ${type}`;
                callout.innerHTML = `
                    <div class="callout-icon">${icon}</div>
                    <div class="callout-body">
                        <div class="callout-title">${escapeHtml(title)}</div>
                        <div class="callout-content">${marked.parseInline(body)}</div>
                    </div>
                `;
                bq.parentNode.replaceWith(callout);
            }
        });

        container.querySelectorAll('p').forEach(p => {
            const html = p.innerHTML.trim();
            if (p.closest('.callout') || p.closest('pre') || p.closest('.code-block')) return;
            const match = html.match(/^([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]+)?\s*<strong>([^<]+?):?<\/strong>\s*([\s\S]*)$/u);
            if (match) {
                const emoji = (match[1] || '').trim();
                const label = match[2].trim();
                const labelLower = label.toLowerCase().replace(/[^a-záéíóúñ]/g, '');
                let type = null;
                if (emoji && EMOJI_TO_TYPE[emoji]) type = EMOJI_TO_TYPE[emoji];
                else if (CALLOUT_TYPES[labelLower]) type = CALLOUT_TYPES[labelLower].cls;
                if (type && label.length < 25 && !/^\s*$/.test(match[3])) {
                    const icon = emoji || CALLOUT_TYPES[Object.keys(CALLOUT_TYPES).find(k => CALLOUT_TYPES[k].cls === type)]?.icon || "💡";
                    const callout = document.createElement('div');
                    callout.className = `callout ${type}`;
                    callout.innerHTML = `
                        <div class="callout-icon">${icon}</div>
                        <div class="callout-body">
                            <div class="callout-title">${escapeHtml(label)}</div>
                            <div class="callout-content">${match[3]}</div>
                        </div>
                    `;
                    p.parentNode.replaceWith(callout);
                }
            }
        });

        container.querySelectorAll('p, li, h1, h2, h3, h4').forEach(el => {
            let html = el.innerHTML;
            if (el.closest('pre') || el.closest('.code-block') || el.closest('.callout-icon')) return;
            html = html.replace(/([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F02F}]+)/gu, '<span class="emoji-big">$1</span>');
            if (html !== el.innerHTML) el.innerHTML = html;
        });
    }

    document.addEventListener('DOMContentLoaded', initApp);

    async function initApp() {
        mermaid.initialize({ startOnLoad: false, theme: 'dark',
            themeVariables: { primaryColor: '#1a1a1a', primaryTextColor: '#fff', primaryBorderColor: '#4f9eff',
            lineColor: '#4f9eff', secondaryColor: '#111', tertiaryColor: '#0a0a0a' }
        });

        const savedEmail = localStorage.getItem('apoloxia_session_email');
        if (!savedEmail) {
            window.location.href = 'index.html';
            return;
        }
        state.userEmail = savedEmail;
        state.userName = savedEmail.split('@')[0];
        updateUserUI();

        await loadUserConfig();
        await loadConversations();
        renderWelcomeBanner();
        focusInput();
    }

    function updateUserUI() {
        document.getElementById('userName').innerText = state.userName;
        document.getElementById('userAvatar').innerText = state.userName.charAt(0).toUpperCase();
        document.getElementById('settingsEmail').innerText = state.userEmail;
        const tierEl = document.getElementById('userTier');
        tierEl.innerText = state.userTier.toUpperCase();
        tierEl.className = 'user-tier';
    }

    async function loadUserConfig() {
        try {
            const res = await fetch(`${API_BASE_URL}/user-config/${encodeURIComponent(state.userEmail)}`);
            if (!res.ok) { applyDefaultConfig(); return; }
            const data = await res.json();
            applyConfig(data);
        } catch (e) { applyDefaultConfig(); }
    }

    function applyConfig(data) {
        state.userTier = data.tier || 'free';
        state.remainingDaily = data.remaining_daily || 100;
        state.maxDaily = data.max_daily_responses || 100;
        state.availableModels = data.available_models || [];
        state.availableAgents = data.available_agents || [];
        MODELS_CATALOG = {};
        state.availableModels.forEach(m => { MODELS_CATALOG[m.id] = m; });
        if (state.availableModels.length && !state.currentModelId) {
            state.currentModelId = state.availableModels[0].id;
        }
        updateUserUI();
        updateRemainingBadge();
        renderModelDropdown();
        renderAgentDropdown();
        renderTierCards();
        document.getElementById('currentModel').innerText = MODELS_CATALOG[state.currentModelId]?.name || 'Modelo';
        document.getElementById('currentAgent').innerText = formatAgentName(state.currentAgentId);
    }

    function applyDefaultConfig() {
        state.userTier = 'free';
        state.remainingDaily = 100;
        state.maxDaily = 100;
        state.availableModels = [{id: 'or-gemma-4-31b', name: 'Gemma 4 31B (gratis)', provider: 'openrouter', free: true}];
        state.availableAgents = ['general'];
        state.currentModelId = 'or-gemma-4-31b';
        state.currentAgentId = 'general';
        applyConfig({
            tier: 'free', remaining_daily: 100, max_daily_responses: 100,
            available_models: state.availableModels, available_agents: state.availableAgents
        });
    }

    async function loadConversations() {
        let backendConvs = [];
        try {
            const res = await fetch(`${API_BASE_URL}/conversations/${encodeURIComponent(state.userEmail)}`);
            if (res.ok) {
                const data = await res.json();
                backendConvs = data.conversations || [];
            }
        } catch (e) {}

        const localConvs = getConversationsFromLocal(state.userEmail);
        const combined = [...backendConvs];
        localConvs.forEach(lc => {
            if (!combined.find(c => c.conversation_id === lc.conversation_id)) combined.push(lc);
        });
        combined.sort((a, b) => {
            const da = a.last_access ? new Date(a.last_access).getTime() : 0;
            const db = b.last_access ? new Date(b.last_access).getTime() : 0;
            return db - da;
        });
        state.conversations = combined;
        renderConversationList();
    }

    function renderConversationList() {
        const container = document.getElementById('conversationList');
        if (!state.conversations.length) {
            container.innerHTML = '<div style="padding:20px;text-align:center;color:#555;font-size:0.85rem;">💬 No hay conversaciones</div>';
            return;
        }
        container.innerHTML = state.conversations.map(conv => `
            <div class="conversation-item ${state.conversationId === conv.conversation_id ? 'active' : ''}" onclick="selectConversation('${conv.conversation_id}')">
                <div class="conv-icon">💬</div>
                <div class="conv-info">
                    <div class="conv-title">${conv.last_message ? conv.last_message.substring(0, 30) : 'Conversación ' + conv.conversation_id.slice(-6)}</div>
                    <div class="conv-time">${conv.last_access ? new Date(conv.last_access).toLocaleString() : 'Sin fecha'}</div>
                </div>
                <div class="conv-delete" onclick="event.stopPropagation(); deleteConversation('${conv.conversation_id}')">🗑️</div>
            </div>
        `).join('');
    }

    async function deleteConversation(convId) {
        if (!confirm('¿Eliminar esta conversación?')) return;
        try { await fetch(`${API_BASE_URL}/conversations/${encodeURIComponent(state.userEmail)}/${convId}`, { method: 'DELETE' }); } catch(e) {}
        deleteConversationFromLocal(state.userEmail, convId);
        state.conversations = state.conversations.filter(c => c.conversation_id !== convId);
        if (state.conversationId === convId) {
            state.conversationId = null;
            document.getElementById('messagesWrapper').innerHTML = '';
            renderWelcomeBanner();
            document.getElementById('headerTitle').innerText = 'Nueva conversación';
        }
        renderConversationList();
        showToast('Conversación eliminada', 'success');
    }

    function selectConversation(convId) {
        state.conversationId = convId;
        renderConversationList();
        document.getElementById('headerTitle').innerText = `Conversación ${convId.slice(-6)}`;
        const messages = getMessagesFromLocal(state.userEmail, convId);
        const wrapper = document.getElementById('messagesWrapper');
        wrapper.innerHTML = '';
        if (messages.length === 0) {
            addMessageToUI('assistant', 'Has retomado esta conversación. Puedes seguir preguntando. 🚀');
        } else {
            messages.forEach(msg => {
                if (msg.role === 'user') addMessageToUI('user', msg.content);
                else addMessageToUI('assistant', msg.content);
            });
        }
        focusInput();
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message || state.isTyping) return;

        input.value = '';
        input.style.height = 'auto';

        if (!state.conversationId) {
            state.conversationId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
        }

        addMessageToUI('user', escapeHtml(message));
        let messages = getMessagesFromLocal(state.userEmail, state.conversationId);
        messages.push({ role: 'user', content: message, timestamp: new Date().toISOString() });
        saveMessagesToLocal(state.userEmail, state.conversationId, messages);
        updateConversationListLocal(state.userEmail, state.conversationId, message);
        await loadConversations();

        showTypingIndicator();
        state.isTyping = true;
        updateSendButton();

        try {
            const payload = {
                user_id: state.userEmail,
                conversation_id: state.conversationId,
                message: message,
                tier: state.userTier,
                agent_type: state.currentAgentId,
                model_id: state.currentModelId,
                use_web_search: state.webSearchEnabled,
                enable_multi_agent: state.multiAgentEnabled,
                file_content: state.uploadedFile
            };

            const res = await fetch(`${API_BASE_URL}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const errorData = await res.json().catch(() => ({}));
                throw new Error(errorData.detail || `Error ${res.status}`);
            }

            const data = await res.json();
            hideTypingIndicator();

            let badgesHtml = '';
            if (data.web_search_used) {
                badgesHtml += '<span class="feature-badge badge-web">🔍 Web</span>';
                badgesHtml += '<span class="search-engines-badge">Tavily · Exa AI · MediaStack</span>';
            }
            if (data.multi_agent_responses && data.multi_agent_responses.length > 0) {
                badgesHtml += '<span class="feature-badge badge-multi">🤖 Multi</span>';
            }
            badgesHtml += `<span class="feature-badge badge-agent">👤 ${formatAgentName(data.agent_used)}</span>`;
            badgesHtml += `<span class="feature-badge badge-model">🧠 ${data.model_used}</span>`;

            const responseContent = data.response || 'Sin respuesta';
            addAssistantMessage(responseContent, badgesHtml);

            let msgs = getMessagesFromLocal(state.userEmail, state.conversationId);
            msgs.push({ role: 'assistant', content: responseContent, timestamp: new Date().toISOString() });
            saveMessagesToLocal(state.userEmail, state.conversationId, msgs);

            state.remainingDaily = data.remaining_daily;
            updateRemainingBadge();
            await loadConversations();
        } catch (err) {
            hideTypingIndicator();
            addMessageToUI('assistant', `❌ **Error:** ${escapeHtml(err.message)}`);
            showToast(err.message, 'error');
        } finally {
            state.isTyping = false;
            updateSendButton();
            removeFile();
        }
    }

    function addMessageToUI(role, content) {
        const wrapper = document.getElementById('messagesWrapper');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        const avatar = role === 'user' ? state.userName.charAt(0).toUpperCase() : '⚡';

        if (role === 'user') {
            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${content}</div>
            `;
        } else {
            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-body">
                    <div class="message-content">${content}</div>
                    <div class="message-meta-row">

            `;

        scrollToBottom();
    }

    function addAssistantMessage(markdownContent, badgesHtml = '') {
        const wrapper = document.getElementById('messagesWrapper');
        const div = document.createElement('div');
        div.className = 'message assistant';
        const msgId = 'msg-' + Date.now();

        div.innerHTML = `
            <div class="message-avatar">⚡</div>
            <div class="message-body">
                <div class="feature-badges">${badgesHtml}</div>
                <div class="message-content" id="${msgId}"></div>
                <div class="message-meta-row">
                    <span class="message-time">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
                    <div class="message-actions-bar">
                        <button class="msg-action-btn" onclick="copyMessage('${msgId}')" title="Copiar">📋</button>
                        <button class="msg-action-btn" onclick="regenerateLastMessage()" title="Regenerar">🔄</button>
                        <button class="msg-action-btn" onclick="exportMessage('${msgId}', 'docx')" title="Descargar Word">📝 Word</button>
                        <div style="position:relative;">
                            <button class="msg-action-btn" onclick="toggleShareMenu(this)">📤</button>
                            <div class="share-menu">
                                <div class="share-option" onclick="shareTo('whatsapp','${msgId}')">📱 WhatsApp</div>
                                <div class="share-option" onclick="shareTo('twitter','${msgId}')">🐦 X</div>
                                <div class="share-option" onclick="shareTo('telegram','${msgId}')">✈️ Telegram</div>
                                <div class="share-option" onclick="shareTo('linkedin','${msgId}')">💼 LinkedIn</div>
                                <div class="share-option" onclick="shareTo('email','${msgId}')">📧 Email</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        wrapper.appendChild(div);

        const contentEl = div.querySelector(`#${msgId}`);
        const htmlContent = marked.parse(markdownContent, { breaks: true, gfm: true });
        contentEl.innerHTML = htmlContent;

        contentEl.querySelectorAll('pre code').forEach((block) => {
            const pre = block.parentElement;
            const lang = block.className.replace('language-', '') || 'text';
            const header = document.createElement('div');
            header.className = 'code-header';
            header.innerHTML = `
                <span class="code-lang">${lang}</span>
                <button class="code-copy" onclick="copyCode(this)">📋 Copiar</button>
            `;
            pre.parentNode.insertBefore(header, pre);
            pre.classList.add('code-block');
        });

        contentEl.querySelectorAll('.language-mermaid, .mermaid').forEach((el) => {
            const container = document.createElement('div');
            container.className = 'mermaid-container';
            const md = document.createElement('div');
            md.className = 'mermaid';
            md.textContent = el.textContent;
            container.appendChild(md);
            el.parentNode.replaceWith(container);
        });

        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(contentEl, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\[', right: '\\]', display: true},
                    {left: '\\(', right: '\\)', display: false}
                ],
                throwOnError: false
            });
        }

        processCallouts(contentEl);

        mermaid.init(undefined, div.querySelectorAll('.mermaid'));
        scrollToBottom();
    }

                headers: { 'Content-Type': 'application/json' },

            });

            if (platform === 'email') window.location.href = url;
            else window.open(url, '_blank');
            document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('show'));

    async function exportMessage(msgId, format) {
        const el = document.getElementById(msgId);
        if (!el) return;
        const content = el.innerText;

        const loadingToast = document.createElement('div');
        loadingToast.className = 'toast info';
        const toastId = 'toast-export-' + Date.now();
        loadingToast.id = toastId;
        loadingToast.innerText = `⏳ Generando ${format.toUpperCase()}...`;
        document.getElementById('toastContainer').appendChild(loadingToast);

        try {
            const res = await fetch(`${API_BASE_URL}/export/${format}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: state.userEmail,
                    title: 'Respuesta ApoloXia',
                    content: content,
                    company_name: state.userName
                })
            });

            document.getElementById(toastId)?.remove();

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.detail || `Error ${res.status}`);
            }

            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `apoloxia_${Date.now()}.${format}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            showToast(`✅ ${format.toUpperCase()} descargado`, 'success');
        } catch (e) {
            document.getElementById(toastId)?.remove();
            showToast(`❌ Error al exportar: ${e.message}`, 'error');
            console.error('Export error:', e);
        }
    }

<!-- ============ CAPA VISUAL 3D (solo diseño, no toca la lógica) ============ -->
<script>
(function () {
    /* ---- 1) Cubo 3D CSS dentro del icono de bienvenida ---- */
    function injectCube() {
        document.querySelectorAll('.welcome-icon:not([data-cube])').forEach(el => {
            el.setAttribute('data-cube', '1');
            el.innerHTML =
                '<div class="cube">' +
                '<div class="face f1">A</div><div class="face f2">⚡</div>' +
                '<div class="face f3">A</div><div class="face f4">⚡</div>' +
                '<div class="face f5"></div><div class="face f6"></div>' +
                '</div>';
        });
    }
    const wrapper = document.getElementById('messagesWrapper');
    if (wrapper) {
        new MutationObserver(injectCube).observe(wrapper, { childList: true, subtree: true });
    }
    injectCube();

    /* ---- 2) Tilt 3D en tarjetas rápidas ---- */
    document.addEventListener('mousemove', function (e) {
        const card = e.target.closest && e.target.closest('.quick-action');
        document.querySelectorAll('.quick-action').forEach(c => {
            if (c !== card) c.style.transform = '';
        });
        if (!card) return;
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        card.style.setProperty('--mx', (x * 100) + '%');
        card.style.setProperty('--my', (y * 100) + '%');
        card.style.transform =
            'rotateX(' + ((0.5 - y) * 14) + 'deg) rotateY(' + ((x - 0.5) * 14) + 'deg) translateZ(14px)';
    });
    document.addEventListener('mouseleave', function () {
        document.querySelectorAll('.quick-action').forEach(c => c.style.transform = '');
    });

    /* ---- 3) Modelo 3D de fondo (Three.js) ---- */
    if (typeof THREE === 'undefined') return;
    const canvas = document.getElementById('bg3d');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05060d, 0.045);
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 9);

    const core = new THREE.Group();
    scene.add(core);

    // Nudo toroidal wireframe (cian)
    const knot = new THREE.Mesh(
        new THREE.TorusKnotGeometry(1.7, 0.45, 220, 24, 2, 3),
        new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.32 })
    );
    core.add(knot);

    // Icosaedro interior sólido brillante (violeta)
    const ico = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.95, 1),
        new THREE.MeshBasicMaterial({ color: 0x7c3aed, wireframe: true, transparent: true, opacity: 0.85 })
    );
    core.add(ico);

    const glowCore = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.55, 2),
        new THREE.MeshBasicMaterial({ color: 0xff2bd6, transparent: true, opacity: 0.55 })
    );
    core.add(glowCore);

    // Anillos orbitales
    const ringMat = function (c, o) { return new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, side: THREE.DoubleSide }); };
    const ring1 = new THREE.Mesh(new THREE.RingGeometry(3.2, 3.23, 128), ringMat(0x00e5ff, 0.5));
    const ring2 = new THREE.Mesh(new THREE.RingGeometry(3.9, 3.93, 128), ringMat(0xff2bd6, 0.4));
    ring1.rotation.x = Math.PI / 2.4;
    ring2.rotation.x = Math.PI / 1.8; ring2.rotation.y = 0.5;
    core.add(ring1, ring2);

    // Satélites en órbita
    const sats = [];
    for (let i = 0; i < 6; i++) {
        const s = new THREE.Mesh(
            new THREE.OctahedronGeometry(0.14, 0),
            new THREE.MeshBasicMaterial({ color: i % 2 ? 0x00e5ff : 0xff2bd6 })
        );
        s.userData = { r: 3.2 + (i % 2) * 0.7, a: (i / 6) * Math.PI * 2, sp: 0.4 + i * 0.07, tilt: i % 2 ? 1.8 : 2.4 };
        core.add(s);
        sats.push(s);
    }

    // Campo de partículas
    const N = 900;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
        pos[i * 3] = (Math.random() - 0.5) * 40;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 26;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 30 - 4;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x8fd8ff, size: 0.045, transparent: true, opacity: 0.8 }));
    scene.add(points);

    function placeCore() {
        const wide = window.innerWidth > 900;
        core.position.set(wide ? 4.2 : 0, wide ? 0.2 : 2.2, wide ? -1.5 : -3);
        core.scale.setScalar(wide ? 1 : 0.7);
    }
    placeCore();

    let mx = 0, my = 0;
    window.addEventListener('mousemove', function (e) {
        mx = (e.clientX / window.innerWidth - 0.5) * 2;
        my = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    window.addEventListener('resize', function () {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        placeCore();
    });

    const clock = new THREE.Clock();
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function loop() {
        requestAnimationFrame(loop);
        if (document.hidden) return;
        const t = clock.getElapsedTime();
        const k = reduce ? 0 : 1;
        knot.rotation.x = t * 0.18 * k;
        knot.rotation.y = t * 0.26 * k;
        ico.rotation.x = -t * 0.5 * k;
        ico.rotation.y = t * 0.4 * k;
        const pulse = 1 + Math.sin(t * 2) * 0.08;
        glowCore.scale.setScalar(pulse);
        ring1.rotation.z = t * 0.3 * k;
        ring2.rotation.z = -t * 0.22 * k;
        sats.forEach(function (s) {
            const d = s.userData;
            const a = d.a + t * d.sp * k;
            s.position.set(Math.cos(a) * d.r, Math.sin(a) * d.r * Math.cos(d.tilt) * 0.6, Math.sin(a) * d.r * 0.6);
            s.rotation.x += 0.03; s.rotation.y += 0.04;
        });
        points.rotation.y = t * 0.012 * k;
        points.rotation.x = Math.sin(t * 0.05) * 0.05;

        core.rotation.y += ((mx * 0.5) - core.rotation.y) * 0.03;
        core.rotation.x += ((my * 0.3) - core.rotation.x) * 0.03;
        camera.position.x += (mx * 0.6 - camera.position.x) * 0.03;
        camera.position.y += (-my * 0.4 - camera.position.y) * 0.03;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
    }
    loop();
})();
</script>
