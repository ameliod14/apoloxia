<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ApoloXia · Chat IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-sidebar: #0a0a0a;
            --border-light: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #6e6e6e;
            --accent-blue: #4f9eff;
            --accent-blue-dark: #3b82f6;
            --accent-gray: #888888;
            --hover-gray: #2a2a2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-gray); }

        .app { display: flex; height: 100vh; width: 100vw; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(79, 158, 255, 0.3);
        }

        .sidebar-brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .sidebar-brand span { color: var(--accent-blue); }

        .new-chat-btn {
            margin: 16px 16px 8px;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .new-chat-btn:hover {
            background: var(--hover-gray);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .sidebar-section-title {
            padding: 16px 20px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
        }

        .conversation-item {
            padding: 10px 14px;
            margin: 2px 0;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .conversation-item:hover { background: var(--bg-secondary); }
        .conversation-item.active {
            background: rgba(79, 158, 255, 0.08);
            border-color: var(--accent-blue);
        }
        .conversation-item.active .conv-title { color: var(--accent-blue); }

        .conv-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
            border: 1px solid var(--border-light);
        }

        .conv-info { flex: 1; min-width: 0; }
        .conv-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .conv-delete {
            opacity: 0;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .conversation-item:hover .conv-delete { opacity: 1; }
        .conv-delete:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-light);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border-light);
        }
        .user-profile:hover { background: var(--hover-gray); border-color: var(--accent-blue); }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .user-info { flex: 1; min-width: 0; }
        .user-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-tier {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent-gray);
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .chat-header {
            height: 60px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(15,15,15,0.85);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
        }
        .menu-toggle:hover { background: var(--bg-secondary); }

        .header-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .header-btn {
            padding: 6px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .header-btn:hover {
            background: var(--hover-gray);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }
        .header-btn.active {
            background: rgba(79, 158, 255, 0.12);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* ===== MESSAGES ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
        }

        .messages-wrapper {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .welcome-banner {
            text-align: center;
            padding: 40px 20px 30px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            margin: 0 auto 20px;
            box-shadow: 0 0 40px rgba(79, 158, 255, 0.3);
        }

        .welcome-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .welcome-title .highlight {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .welcome-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            max-width: 650px;
            margin: 0 auto;
        }

        .quick-action {
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
        }
        .quick-action:hover {
            background: var(--hover-gray);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .quick-action-icon { font-size: 1.5rem; margin-bottom: 8px; }
        .quick-action-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .quick-action-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 24px;
            animation: msgIn 0.3s ease;
        }
        .message.user { flex-direction: row-reverse; }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
            color: #fff;
        }
        .message.assistant .message-avatar {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            color: var(--accent-blue);
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.user .message-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }
        .message.assistant .message-content {
            background: transparent;
            color: var(--text-secondary);
            padding: 0 0 0 4px;
            border-radius: 0;
            max-width: 100%;
        }
        .message.assistant .message-body {
            flex: 1;
            max-width: 100%;
        }

        /* Mensajes enriquecidos */
        .message.assistant .message-content h1,
        .message.assistant .message-content h2,
        .message.assistant .message-content h3 {
            margin: 20px 0 10px 0;
            font-weight: 700;
            color: var(--text-primary);
        }
        .message.assistant .message-content h1 { font-size: 1.4rem; border-bottom: 1px solid var(--border-light); padding-bottom: 6px; }
        .message.assistant .message-content h2 { font-size: 1.2rem; color: var(--accent-blue); }
        .message.assistant .message-content h3 { font-size: 1.05rem; color: var(--text-secondary); }

        .message.assistant .message-content p { margin-bottom: 12px; }
        .message.assistant .message-content ul, .message.assistant .message-content ol {
            margin: 8px 0 8px 20px;
            color: var(--text-secondary);
        }
        .message.assistant .message-content li { margin-bottom: 6px; }
        .message.assistant .message-content strong { color: var(--text-primary); }
        .message.assistant .message-content blockquote {
            border-left: 3px solid var(--accent-blue);
            padding: 8px 16px;
            margin: 12px 0;
            background: rgba(79,158,255,0.06);
            border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
        }

        .code-block {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            margin: 12px 0;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
        }
        .code-lang {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
        }
        .code-copy {
            padding: 4px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .code-copy:hover { background: var(--hover-gray); color: var(--text-primary); border-color: var(--accent-blue); }

        .code-block pre {
            padding: 14px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .mermaid-container {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            text-align: center;
            overflow: auto;
        }

        .katex-display {
            margin: 12px 0;
            padding: 12px;
            background: var(--bg-sidebar);
            border-radius: 8px;
            border: 1px solid var(--border-light);
            overflow-x: auto;
        }

        .feature-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .feature-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
        }
        .badge-web { color: var(--accent-blue); border-color: var(--accent-blue); }
        .badge-search { color: #10b981; border-color: #10b981; } /* nuevo */
        .badge-multi { color: #8b5cf6; border-color: #8b5cf6; }
        .badge-agent { color: var(--accent-gray); }
        .badge-model { color: #22c55e; border-color: #22c55e; }

        .search-engines-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 20px;
            color: #10b981;
            margin-right: 6px;
        }

        .message-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--border-light);
        }
        .message-time {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .message-actions-bar {
            display: flex;
            gap: 4px;
        }
        .msg-action-btn {
            padding: 4px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .msg-action-btn:hover {
            background: var(--hover-gray);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .share-menu {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 6px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            gap: 2px;
            min-width: 160px;
            z-index: 100;
        }
        .share-menu.show { display: flex; animation: dropdownIn 0.2s ease; }
        .share-option {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .share-option:hover { background: var(--bg-secondary); color: var(--text-primary); }

        @keyframes dropdownIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 14px;
            width: fit-content;
            margin-bottom: 20px;
            border: 1px solid var(--border-light);
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-blue);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ===== INPUT ===== */
        .input-container {
            padding: 16px 24px 24px;
            background: linear-gradient(to top, var(--bg-primary) 70%, transparent);
        }

        .input-wrapper {
            max-width: 850px;
            margin: 0 auto;
            position: relative;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 10px 16px;
            transition: all 0.3s;
        }
        .input-box:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(79,158,255,0.08);
        }

        .input-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 200px;
            min-height: 24px;
            line-height: 1.5;
        }
        .input-textarea::placeholder { color: var(--text-muted); }

        .input-actions { display: flex; gap: 4px; align-items: center; }

        .input-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .input-btn:hover { background: var(--hover-gray); color: var(--text-primary); }
        .input-btn.active { color: var(--accent-blue); background: rgba(79,158,255,0.1); }

        .input-btn.send {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
            color: #fff;
        }
        .input-btn.send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(79,158,255,0.4);
        }
        .input-btn.send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .file-input { display: none; }

        .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            padding: 0 8px;
        }
        .input-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .input-hint span { color: var(--accent-blue); font-weight: 600; }
        .search-engines-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            background: var(--bg-secondary);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
        }

        .remaining-badge {
            font-size: 0.7rem;
            padding: 4px 12px;
            background: var(--bg-secondary);
            border-radius: 20px;
            color: var(--text-secondary);
            font-weight: 600;
            border: 1px solid var(--border-light);
        }
        .remaining-badge.low { color: #ef4444; border-color: #ef4444; background: rgba(239,68,68,0.08); }

        .file-preview {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .file-preview.show { display: flex; }
        .file-preview .remove-file {
            margin-left: auto;
            cursor: pointer;
            color: #ef4444;
            font-weight: 700;
        }

        /* ===== DROPDOWNS ===== */
        .model-dropdown, .agent-dropdown {
            position: absolute;
            bottom: 100%;
            left: 0;
            margin-bottom: 8px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 8px;
            min-width: 280px;
            max-height: 360px;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: none;
            z-index: 200;
        }
        .model-dropdown.show, .agent-dropdown.show { display: block; animation: dropdownIn 0.2s ease; }

        .dropdown-header {
            padding: 8px 12px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .model-option, .agent-option {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
            border: 1px solid transparent;
        }
        .model-option:hover, .agent-option:hover { background: var(--bg-secondary); }
        .model-option.selected, .agent-option.selected {
            background: rgba(79,158,255,0.08);
            border-color: var(--accent-blue);
        }

        .model-option .model-name {
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .model-option .model-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .tier-tag {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .tag-free { background: var(--bg-secondary); color: var(--text-muted); }
        .tag-plus { background: rgba(79,158,255,0.12); color: var(--accent-blue); }
        .tag-gt { background: rgba(139,92,246,0.12); color: #8b5cf6; }

        /* ===== SETTINGS ===== */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .settings-overlay.show { display: flex; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .settings-panel {
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .settings-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .settings-title { font-size: 1.1rem; font-weight: 700; }
        .settings-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
        }
        .settings-close:hover { background: var(--bg-secondary); }

        .settings-body {
            padding: 20px 24px;
            overflow-y: auto;
            max-height: 60vh;
        }
        .setting-item { margin-bottom: 24px; }
        .setting-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .setting-desc { font-size: 0.85rem; color: var(--text-secondary); }

        .tier-cards { display: grid; gap: 10px; }

        .tier-card {
            padding: 14px 16px;
            border: 2px solid var(--border-light);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tier-card:hover { border-color: var(--accent-blue); }
        .tier-card.current {
            border-color: var(--accent-blue);
            background: rgba(79,158,255,0.06);
        }

        .tier-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .tier-card-name { font-size: 1rem; font-weight: 700; }
        .tier-card-price { font-size: 0.85rem; font-weight: 700; color: var(--accent-blue); }
        .tier-card-features {
            font-size: 0.8rem;
            color: var(--text-secondary);
            list-style: none;
        }
        .tier-card-features li { padding: 2px 0; padding-left: 18px; position: relative; }
        .tier-card-features li::before { content: "✓"; position: absolute; left: 0; color: var(--accent-blue); font-weight: 700; }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 18px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: toastIn 0.3s ease;
            max-width: 340px;
        }
        .toast.success { border-left: 3px solid #22c55e; }
        .toast.error { border-left: 3px solid #ef4444; }
        .toast.warning { border-left: 3px solid #f59e0b; }
        .toast.info { border-left: 3px solid var(--accent-blue); }

        @keyframes toastIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
                z-index: 200;
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            .messages-wrapper { padding: 0 16px; }
            .message-content { max-width: 90%; }
            .welcome-title { font-size: 1.6rem; }
            .quick-actions { grid-template-columns: 1fr; }
            .header-actions { display: none; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">A</div>
            <div class="sidebar-brand">Apolo<span>Xia</span></div>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nueva conversación
        </button>
        <div class="sidebar-section-title">Historial</div>
        <div class="conversation-list" id="conversationList"></div>
        <div class="sidebar-footer">
            <div class="user-profile" onclick="openSettings()">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-info">
                    <div class="user-name" id="userName">Usuario</div>
                    <div class="user-tier" id="userTier">FREE</div>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="chat-header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <span class="header-title" id="headerTitle">Nueva conversación</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="webSearchBtn" onclick="toggleWebSearch()">🔍 Web</button>
                <button class="header-btn" id="multiAgentBtn" onclick="toggleMultiAgent()">🤖 Multi</button>
                <button class="header-btn" onclick="document.getElementById('fileInput').click()">📎 Archivo</button>
                <button class="header-btn" onclick="openSettings()">⚙️</button>
            </div>
        </header>

        <div class="messages-container" id="messagesContainer">
            <div class="messages-wrapper" id="messagesWrapper"></div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <div class="file-preview" id="filePreview">
                    <span>📎</span><span id="fileName">archivo.txt</span>
                    <span class="remove-file" onclick="removeFile()">✕</span>
                </div>
                <div class="input-box">
                    <textarea class="input-textarea" id="messageInput" placeholder="Escribe tu mensaje..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                    <div class="input-actions">
                        <button class="input-btn" onclick="toggleModelSelector()" title="Modelo">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                <line x1="8" y1="21" x2="16" y2="21"></line>
                                <line x1="12" y1="17" x2="12" y2="21"></line>
                            </svg>
                        </button>
                        <button class="input-btn" onclick="toggleAgentSelector()" title="Agente">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="22"></line>
                                <line x1="8" y1="22" x2="16" y2="22"></line>
                            </svg>
                        </button>
                        <button class="input-btn send" id="sendBtn" onclick="sendMessage()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="input-footer">
                    <div class="input-hint">
                        <span id="currentModel">Cargando...</span> ·
                        <span id="currentAgent">General</span> ·
                        <span>Enter</span> enviar · <span>Shift+Enter</span> nueva línea
                        <span class="search-engines-label" style="margin-left:8px;">🔍 Tavily · Exa AI · MediaStack</span>
                    </div>
                    <div class="remaining-badge" id="remainingBadge">--/--</div>
                </div>
                <div class="model-dropdown" id="modelDropdown"></div>
                <div class="agent-dropdown" id="agentDropdown"></div>
            </div>
        </div>
    </main>
</div>

<input type="file" id="fileInput" class="file-input" onchange="handleFileSelect(event)" accept=".txt,.py,.js,.html,.css,.json,.md,.csv">

<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings(event)">
    <div class="settings-panel" onclick="event.stopPropagation()">
        <div class="settings-header">
            <div class="settings-title">⚙️ Configuración</div>
            <button class="settings-close" onclick="closeSettings()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="settings-body">
            <div class="setting-item">
                <div class="setting-label">📧 Cuenta</div>
                <div class="setting-desc" id="settingsEmail"></div>
            </div>
            <div class="setting-item">
                <div class="setting-label">⭐ Plan actual</div>
                <div class="tier-cards" id="tierCards"></div>
            </div>
            <div class="setting-item">
                <div class="setting-label">🛠️ Acciones</div>
                <button class="new-chat-btn" onclick="clearAllConversations()" style="margin:0 0 10px 0; background:var(--bg-secondary); color:var(--text-primary); border:1px solid var(--border-light);">
                    🗑️ Borrar todas
                </button>
                <button class="new-chat-btn" onclick="logout()" style="margin:0; background:rgba(239,68,68,0.08); color:#ef4444; border:1px solid rgba(239,68,68,0.2);">
                    🚪 Cerrar sesión
                </button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
    // ========== CONFIGURACIÓN ==========
    const API_BASE_URL = '';
    let state = {
        userEmail: '',
        userName: '',
        userTier: 'free',
        remainingDaily: 100,
        maxDaily: 100,
        conversationId: null,
        conversations: [],
        currentModelId: null,
        currentAgentId: 'general',
        webSearchEnabled: false,
        multiAgentEnabled: false,
        isTyping: false,
        availableModels: [],
        availableAgents: [],
        uploadedFile: null
    };
    let MODELS_CATALOG = {};

    // ========== FUNCIONES DE ALMACENAMIENTO LOCAL ==========
    function getLocalStorageKey(email, convId) {
        return `apoloxia_messages_${email}_${convId}`;
    }

    function getConversationsKey(email) {
        return `apoloxia_conversations_${email}`;
    }

    function saveMessagesToLocal(email, convId, messages) {
        if (!convId) return;
        const key = getLocalStorageKey(email, convId);
        localStorage.setItem(key, JSON.stringify(messages));
    }

    function getMessagesFromLocal(email, convId) {
        if (!convId) return [];
        const key = getLocalStorageKey(email, convId);
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : [];
    }

    function saveConversationsToLocal(email, conversations) {
        const key = getConversationsKey(email);
        localStorage.setItem(key, JSON.stringify(conversations));
    }

    function getConversationsFromLocal(email) {
        const key = getConversationsKey(email);
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : [];
    }

    function deleteConversationFromLocal(email, convId) {
        const key = getLocalStorageKey(email, convId);
        localStorage.removeItem(key);
        // Also remove from conversations list
        let convs = getConversationsFromLocal(email);
        convs = convs.filter(c => c.conversation_id !== convId);
        saveConversationsToLocal(email, convs);
    }

    function updateConversationListLocal(email, convId, lastMessage) {
        let convs = getConversationsFromLocal(email);
        const existing = convs.find(c => c.conversation_id === convId);
        const now = new Date().toISOString();
        if (existing) {
            existing.last_access = now;
            existing.last_message = lastMessage;
        } else {
            convs.push({
                conversation_id: convId,
                last_access: now,
                last_message: lastMessage,
                message_count: 0
            });
        }
        saveConversationsToLocal(email, convs);
        return convs;
    }

    // ========== INICIO ==========
    document.addEventListener('DOMContentLoaded', initApp);

    async function initApp() {
        mermaid.initialize({ startOnLoad: false, theme: 'dark',
            themeVariables: { primaryColor: '#1a1a1a', primaryTextColor: '#fff', primaryBorderColor: '#4f9eff',
            lineColor: '#4f9eff', secondaryColor: '#111', tertiaryColor: '#0a0a0a' }
        });

        const savedEmail = localStorage.getItem('apoloxia_session_email');
        if (!savedEmail) {
            window.location.href = 'index.html';
            return;
        }
        state.userEmail = savedEmail;
        state.userName = savedEmail.split('@')[0];
        updateUserUI();

        // Cargar conversaciones desde el backend y desde localStorage
        await loadUserConfig();
        await loadConversations();
        renderWelcomeBanner();
        focusInput();
    }

    function updateUserUI() {
        document.getElementById('userName').innerText = state.userName;
        document.getElementById('userAvatar').innerText = state.userName.charAt(0).toUpperCase();
        document.getElementById('settingsEmail').innerText = state.userEmail;
        const tierEl = document.getElementById('userTier');
        tierEl.innerText = state.userTier.toUpperCase();
        tierEl.className = 'user-tier';
    }

    // ========== CONFIGURACIÓN ==========
    async function loadUserConfig() {
        try {
            const res = await fetch(`${API_BASE_URL}/user-config/${encodeURIComponent(state.userEmail)}`);
            if (!res.ok) { applyDefaultConfig(); return; }
            const data = await res.json();
            applyConfig(data);
        } catch (e) { applyDefaultConfig(); }
    }

    function applyConfig(data) {
        state.userTier = data.tier || 'free';
        state.remainingDaily = data.remaining_daily || 100;
        state.maxDaily = data.max_daily_responses || 100;
        state.availableModels = data.available_models || [];
        state.availableAgents = data.available_agents || [];
        MODELS_CATALOG = {};
        state.availableModels.forEach(m => { MODELS_CATALOG[m.id] = m; });
        if (state.availableModels.length && !state.currentModelId) {
            state.currentModelId = state.availableModels[0].id;
        }
        updateUserUI();
        updateRemainingBadge();
        renderModelDropdown();
        renderAgentDropdown();
        renderTierCards();
        document.getElementById('currentModel').innerText = MODELS_CATALOG[state.currentModelId]?.name || 'Modelo';
        document.getElementById('currentAgent').innerText = formatAgentName(state.currentAgentId);
    }

    function applyDefaultConfig() {
        state.userTier = 'free';
        state.remainingDaily = 100;
        state.maxDaily = 100;
        state.availableModels = [{id: 'gpt-oss-20b', name: 'GPT OSS 20B', params: '20B', context: '128K', tier: 'free'}];
        state.availableAgents = ['general'];
        state.currentModelId = 'gpt-oss-20b';
        state.currentAgentId = 'general';
        applyConfig({
            tier: 'free',
            remaining_daily: 100,
            max_daily_responses: 100,
            available_models: state.availableModels,
            available_agents: state.availableAgents
        });
    }

    // ========== CONVERSACIONES ==========
    async function loadConversations() {
        // Cargar conversaciones del backend
        let backendConvs = [];
        try {
            const res = await fetch(`${API_BASE_URL}/conversations/${encodeURIComponent(state.userEmail)}`);
            if (res.ok) {
                const data = await res.json();
                backendConvs = data.conversations || [];
            }
        } catch (e) {}

        // Cargar conversaciones de localStorage
        const localConvs = getConversationsFromLocal(state.userEmail);

        // Combinar: priorizar backend (tiene message_count, last_access), pero mantener las de local si no están en backend
        const combined = [...backendConvs];
        localConvs.forEach(lc => {
            if (!combined.find(c => c.conversation_id === lc.conversation_id)) {
                combined.push(lc);
            }
        });
        // Ordenar por last_access más reciente
        combined.sort((a, b) => {
            const da = a.last_access ? new Date(a.last_access).getTime() : 0;
            const db = b.last_access ? new Date(b.last_access).getTime() : 0;
            return db - da;
        });
        state.conversations = combined;
        renderConversationList();
    }

    function renderConversationList() {
        const container = document.getElementById('conversationList');
        if (!state.conversations.length) {
            container.innerHTML = '<div style="padding:20px;text-align:center;color:#555;font-size:0.85rem;">💬 No hay conversaciones</div>';
            return;
        }
        container.innerHTML = state.conversations.map(conv => `
            <div class="conversation-item ${state.conversationId === conv.conversation_id ? 'active' : ''}" onclick="selectConversation('${conv.conversation_id}')">
                <div class="conv-icon">💬</div>
                <div class="conv-info">
                    <div class="conv-title">${conv.last_message ? conv.last_message.substring(0, 30) : 'Conversación ' + conv.conversation_id.slice(-6)}</div>
                    <div class="conv-time">${conv.last_access ? new Date(conv.last_access).toLocaleString() : 'Sin fecha'}</div>
                </div>
                <div class="conv-delete" onclick="event.stopPropagation(); deleteConversation('${conv.conversation_id}')">🗑️</div>
            </div>
        `).join('');
    }

    async function deleteConversation(convId) {
        if (!confirm('¿Eliminar esta conversación?')) return;
        // Eliminar del backend
        try {
            await fetch(`${API_BASE_URL}/conversations/${encodeURIComponent(state.userEmail)}/${convId}`, { method: 'DELETE' });
        } catch(e) {}
        // Eliminar de localStorage
        deleteConversationFromLocal(state.userEmail, convId);
        // Actualizar estado
        state.conversations = state.conversations.filter(c => c.conversation_id !== convId);
        if (state.conversationId === convId) {
            state.conversationId = null;
            document.getElementById('messagesWrapper').innerHTML = '';
            renderWelcomeBanner();
            document.getElementById('headerTitle').innerText = 'Nueva conversación';
        }
        renderConversationList();
        showToast('Conversación eliminada', 'success');
    }

    function selectConversation(convId) {
        state.conversationId = convId;
        renderConversationList();
        document.getElementById('headerTitle').innerText = `Conversación ${convId.slice(-6)}`;
        // Cargar mensajes de localStorage
        const messages = getMessagesFromLocal(state.userEmail, convId);
        const wrapper = document.getElementById('messagesWrapper');
        wrapper.innerHTML = '';
        if (messages.length === 0) {
            addMessageToUI('assistant', 'Has retomado esta conversación. Puedes seguir preguntando. 🚀');
        } else {
            messages.forEach(msg => {
                if (msg.role === 'user') {
                    addMessageToUI('user', msg.content);
                } else {
                    // Asumimos que es assistant, pero podríamos tener badges si se guardaron
                    addMessageToUI('assistant', msg.content);
                }
            });
        }
        focusInput();
    }

    // ========== ENVÍO DE MENSAJES ==========
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message || state.isTyping) return;

        input.value = '';
        input.style.height = 'auto';

        if (!state.conversationId) {
            state.conversationId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
        }

        // Añadir mensaje del usuario a la UI y guardar localmente
        addMessageToUI('user', escapeHtml(message));
        // Guardar en localStorage
        let messages = getMessagesFromLocal(state.userEmail, state.conversationId);
        messages.push({ role: 'user', content: message, timestamp: new Date().toISOString() });
        saveMessagesToLocal(state.userEmail, state.conversationId, messages);
        // Actualizar lista de conversaciones local
        updateConversationListLocal(state.userEmail, state.conversationId, message);
        await loadConversations(); // refrescar sidebar

        showTypingIndicator();
        state.isTyping = true;
        updateSendButton();

        try {
            const payload = {
                user_id: state.userEmail,
                conversation_id: state.conversationId,
                message: message,
                tier: state.userTier,
                agent_type: state.currentAgentId,
                model_id: state.currentModelId,
                use_web_search: state.webSearchEnabled,
                enable_multi_agent: state.multiAgentEnabled,
                file_content: state.uploadedFile
            };

            const res = await fetch(`${API_BASE_URL}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const errorData = await res.json().catch(() => ({}));
                throw new Error(errorData.detail || `Error ${res.status}`);
            }

            const data = await res.json();
            hideTypingIndicator();

            let badgesHtml = '';
            if (data.web_search_used) {
                badgesHtml += '<span class="feature-badge badge-web">🔍 Web</span>';
                badgesHtml += '<span class="search-engines-badge">Tavily · Exa AI · MediaStack</span>';
            }
            if (data.multi_agent_responses && data.multi_agent_responses.length > 0) {
                badgesHtml += '<span class="feature-badge badge-multi">🤖 Multi</span>';
            }
            badgesHtml += `<span class="feature-badge badge-agent">👤 ${formatAgentName(data.agent_used)}</span>`;
            badgesHtml += `<span class="feature-badge badge-model">🧠 ${data.model_used}</span>`;

            const responseContent = data.response || 'Sin respuesta';
            addAssistantMessage(responseContent, badgesHtml);

            // Guardar respuesta del asistente en localStorage
            let msgs = getMessagesFromLocal(state.userEmail, state.conversationId);
            msgs.push({ role: 'assistant', content: responseContent, timestamp: new Date().toISOString() });
            saveMessagesToLocal(state.userEmail, state.conversationId, msgs);

            state.remainingDaily = data.remaining_daily;
            updateRemainingBadge();
            // Refrescar conversaciones
            await loadConversations();
        } catch (err) {
            hideTypingIndicator();
            addMessageToUI('assistant', `❌ **Error:** ${escapeHtml(err.message)}`);
            showToast(err.message, 'error');
        } finally {
            state.isTyping = false;
            updateSendButton();
            removeFile();
        }
    }

    // ========== RENDERIZADO ==========
    function addMessageToUI(role, content) {
        const wrapper = document.getElementById('messagesWrapper');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        const avatar = role === 'user' ? state.userName.charAt(0).toUpperCase() : '⚡';

        if (role === 'user') {
            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${content}</div>
            `;
        } else {
            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-body">
                    <div class="message-content">${content}</div>
                    <div class="message-meta-row">
                        <span class="message-time">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
                    </div>
                </div>
            `;
        }
        wrapper.appendChild(div);
        scrollToBottom();
    }

    function addAssistantMessage(markdownContent, badgesHtml = '') {
        const wrapper = document.getElementById('messagesWrapper');
        const div = document.createElement('div');
        div.className = 'message assistant';
        const msgId = 'msg-' + Date.now();

        div.innerHTML = `
            <div class="message-avatar">⚡</div>
            <div class="message-body">
                <div class="feature-badges">${badgesHtml}</div>
                <div class="message-content" id="${msgId}"></div>
                <div class="message-meta-row">
                    <span class="message-time">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
                    <div class="message-actions-bar">
                        <button class="msg-action-btn" onclick="copyMessage('${msgId}')">📋</button>
                        <button class="msg-action-btn" onclick="regenerateLastMessage()">🔄</button>
                        <div style="position:relative;">
                            <button class="msg-action-btn" onclick="toggleShareMenu(this)">📤</button>
                            <div class="share-menu">
                                <div class="share-option" onclick="shareTo('whatsapp','${msgId}')">📱 WhatsApp</div>
                                <div class="share-option" onclick="shareTo('twitter','${msgId}')">🐦 X</div>
                                <div class="share-option" onclick="shareTo('telegram','${msgId}')">✈️ Telegram</div>
                                <div class="share-option" onclick="shareTo('linkedin','${msgId}')">💼 LinkedIn</div>
                                <div class="share-option" onclick="shareTo('email','${msgId}')">📧 Email</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        wrapper.appendChild(div);

        const contentEl = div.querySelector(`#${msgId}`);
        const htmlContent = marked.parse(markdownContent);
        contentEl.innerHTML = htmlContent;

        contentEl.querySelectorAll('pre code').forEach((block) => {
            const pre = block.parentElement;
            const lang = block.className.replace('language-', '') || 'text';
            const header = document.createElement('div');
            header.className = 'code-header';
            header.innerHTML = `
                <span class="code-lang">${lang}</span>
                <button class="code-copy" onclick="copyCode(this)">📋 Copiar</button>
            `;
            pre.parentNode.insertBefore(header, pre);
            pre.classList.add('code-block');
        });

        contentEl.querySelectorAll('.language-mermaid, .mermaid').forEach((el) => {
            const container = document.createElement('div');
            container.className = 'mermaid-container';
            const md = document.createElement('div');
            md.className = 'mermaid';
            md.textContent = el.textContent;
            container.appendChild(md);
            el.parentNode.replaceWith(container);
        });

        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(contentEl, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\[', right: '\\]', display: true},
                    {left: '\\(', right: '\\)', display: false}
                ],
                throwOnError: false
            });
        }

        mermaid.init(undefined, div.querySelectorAll('.mermaid'));
        scrollToBottom();
    }

    // ========== TYPING ==========
    function showTypingIndicator() {
        const wrapper = document.getElementById('messagesWrapper');
        const div = document.createElement('div');
        div.id = 'typingIndicator';
        div.className = 'message assistant';
        div.innerHTML = `
            <div class="message-avatar">⚡</div>
            <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;
        wrapper.appendChild(div);
        scrollToBottom();
    }

    function hideTypingIndicator() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    function scrollToBottom() {
        const container = document.getElementById('messagesContainer');
        container.scrollTop = container.scrollHeight;
    }

    function updateRemainingBadge() {
        const badge = document.getElementById('remainingBadge');
        badge.innerText = `${state.remainingDaily}/${state.maxDaily}`;
        badge.classList.toggle('low', state.remainingDaily < 10);
    }

    function updateSendButton() {
        document.getElementById('sendBtn').disabled = state.isTyping;
    }

    // ========== UTILIDADES ==========
    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    function copyCode(btn) {
        const code = btn.closest('.code-block')?.querySelector('code')?.innerText;
        if (code) { navigator.clipboard.writeText(code); showToast('Código copiado', 'success'); }
    }

    function copyMessage(msgId) {
        const el = document.getElementById(msgId);
        if (el) { navigator.clipboard.writeText(el.innerText); showToast('Copiado', 'success'); }
    }

    function toggleShareMenu(btn) {
        const menu = btn.nextElementSibling;
        document.querySelectorAll('.share-menu').forEach(m => { if (m !== menu) m.classList.remove('show'); });
        menu.classList.toggle('show');
    }

    async function shareTo(platform, msgId) {
        const text = document.getElementById(msgId)?.innerText || '';
        try {
            const res = await fetch(`${API_BASE_URL}/share/links`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ platform, text })
            });
            const data = await res.json();
            const url = data[platform] || data.copy_text;
            if (platform === 'email') window.location.href = url;
            else window.open(url, '_blank');
            document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('show'));
        } catch (e) { showToast('Error al compartir', 'error'); }
    }

    // ========== FILE UPLOAD ==========
    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            state.uploadedFile = evt.target.result;
            document.getElementById('fileName').innerText = file.name;
            document.getElementById('filePreview').classList.add('show');
            showToast(`Archivo "${file.name}" listo`, 'info');
        };
        reader.readAsText(file);
    }

    function removeFile() {
        state.uploadedFile = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('filePreview').classList.remove('show');
    }

    // ========== UI ==========
    function renderWelcomeBanner() {
        const wrapper = document.getElementById('messagesWrapper');
        wrapper.innerHTML = `
            <div class="welcome-banner">
                <div class="welcome-icon">A</div>
                <h1 class="welcome-title">Bienvenido, <span class="highlight">${state.userName}</span></h1>
                <p class="welcome-subtitle">Tu asistente inteligente con modelos de última generación.</p>
                <div class="quick-actions">
                    <div class="quick-action" onclick="quickQuestion('Crea un mapa conceptual sobre inteligencia artificial')">
                        <div class="quick-action-icon">🧠</div>
                        <div class="quick-action-title">Mapa conceptual</div>
                        <div class="quick-action-text">Diagramas y explicaciones</div>
                    </div>
                    <div class="quick-action" onclick="quickQuestion('Genera un sitio web completo para una cafetería moderna')">
                        <div class="quick-action-icon">🌐</div>
                        <div class="quick-action-title">Sitio web</div>
                        <div class="quick-action-text">HTML/CSS/JS listo</div>
                    </div>
                    <div class="quick-action" onclick="quickQuestion('Resuelve esta ecuación diferencial paso a paso: dy/dx = 2x + y')">
                        <div class="quick-action-icon">🔢</div>
                        <div class="quick-action-title">Cálculos</div>
                        <div class="quick-action-text">Matemáticas y fórmulas</div>
                    </div>
                </div>
            </div>
        `;
    }

    function quickQuestion(q) {
        document.getElementById('messageInput').value = q;
        sendMessage();
    }

    function startNewChat() {
        state.conversationId = null;
        document.getElementById('messagesWrapper').innerHTML = '';
        renderWelcomeBanner();
        document.getElementById('headerTitle').innerText = 'Nueva conversación';
        focusInput();
    }

    async function clearAllConversations() {
        if (!confirm('¿Borrar todas las conversaciones?')) return;
        // Borrar todas las conversaciones del backend
        for (let conv of state.conversations) {
            try {
                await fetch(`${API_BASE_URL}/conversations/${encodeURIComponent(state.userEmail)}/${conv.conversation_id}`, { method: 'DELETE' });
            } catch(e) {}
            deleteConversationFromLocal(state.userEmail, conv.conversation_id);
        }
        state.conversations = [];
        renderConversationList();
        startNewChat();
        showToast('Todas las conversaciones borradas', 'success');
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    function openSettings() {
        document.getElementById('settingsOverlay').classList.add('show');
    }

    function closeSettings(e) {
        if (!e || e.target === document.getElementById('settingsOverlay')) {
            document.getElementById('settingsOverlay').classList.remove('show');
        }
    }

    function toggleWebSearch() {
        state.webSearchEnabled = !state.webSearchEnabled;
        document.getElementById('webSearchBtn').classList.toggle('active');
        showToast(state.webSearchEnabled ? '🔍 Búsqueda web activada (Tavily, Exa, MediaStack)' : 'Búsqueda web desactivada', 'info');
    }

    function toggleMultiAgent() {
        state.multiAgentEnabled = !state.multiAgentEnabled;
        document.getElementById('multiAgentBtn').classList.toggle('active');
        showToast(state.multiAgentEnabled ? '🤖 Multi-agente activado' : 'Multi-agente desactivado', 'info');
    }

    function logout() {
        localStorage.removeItem('apoloxia_session_email');
        // Optionally clear local messages? We'll keep them for next login.
        window.location.href = 'index.html';
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
    }

    function focusInput() {
        document.getElementById('messageInput').focus();
    }

    function showToast(msg, type) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function regenerateLastMessage() {
        const lastUserMsg = Array.from(document.querySelectorAll('.message.user')).pop();
        if (lastUserMsg) {
            const text = lastUserMsg.querySelector('.message-content')?.innerText;
            if (text) {
                document.getElementById('messageInput').value = text;
                sendMessage();
            }
        }
    }

    function formatAgentName(agentId) {
        const names = {
            general: 'General',
            generador_sitios_web: 'Generador Sitios Web',
            creador_paneles_ventas: 'Creador Dashboards',
            desarrollador_avanzado: 'Dev Avanzado',
            generador_codigo: 'Generador Código',
            debugger_inteligente: 'Debugger',
            arquitecto_software: 'Arquitecto',
            analista_datos: 'Analista Datos',
            investigacion_cientifica: 'Investigación',
            finanzas_inversion: 'Finanzas',
            educacion_avanzada: 'Educación'
        };
        return names[agentId] || agentId.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    // ========== SELECTORES ==========
    function renderModelDropdown() {
        const container = document.getElementById('modelDropdown');
        if (!state.availableModels.length) return;
        let html = '<div class="dropdown-header">Modelos disponibles</div>';
        html += state.availableModels.map(m => `
            <div class="model-option ${state.currentModelId === m.id ? 'selected' : ''}" onclick="selectModel('${m.id}')">
                <div class="model-name">
                    ${m.name}
                    <span class="tier-tag tag-${m.tier || 'free'}">${m.tier || 'free'}</span>
                </div>
                <div class="model-meta">${m.params} · ${m.context}</div>
            </div>
        `).join('');
        container.innerHTML = html;
    }

    function renderAgentDropdown() {
        const container = document.getElementById('agentDropdown');
        if (!state.availableAgents.length) return;
        let html = '<div class="dropdown-header">Agentes especializados</div>';
        html += state.availableAgents.map(agentId => `
            <div class="agent-option ${state.currentAgentId === agentId ? 'selected' : ''}" onclick="selectAgent('${agentId}')">
                <strong>${formatAgentName(agentId)}</strong>
                <div style="font-size:0.7rem; color:var(--text-muted); margin-top:2px;">${getAgentDesc(agentId)}</div>
            </div>
        `).join('');
        container.innerHTML = html;
    }

    function getAgentDesc(agentId) {
        const descs = {
            general: 'Asistente general',
            generador_sitios_web: 'Genera sitios web completos',
            creador_paneles_ventas: 'Dashboards y gráficos',
            desarrollador_avanzado: 'Apps completas, APIs',
            generador_codigo: 'Código limpio y documentado',
            debugger_inteligente: 'Detección y corrección de bugs',
            arquitecto_software: 'Diseño de sistemas escalables',
            analista_datos: 'Insights y visualización',
            investigacion_cientifica: 'Investigación académica',
            finanzas_inversion: 'Análisis financiero'
        };
        return descs[agentId] || 'Agente especializado';
    }

    function renderTierCards() {
        const tiers = [
            { id: 'free', name: 'Free', limit: '100 msgs/día', price: 'Gratis', models: 'GPT OSS 20B', features: ['Básico', '1 modelo'] },
            { id: 'plus', name: 'Plus', limit: '1,000 msgs/día', price: 'Premium', models: 'GPT OSS 120B, Qwen', features: ['Web search', 'Multi-agente', 'Archivos', '19 agentes'] },
            { id: 'gt', name: 'GT', limit: '5,000 msgs/día', price: 'Elite', models: 'GPT OSS 120B, Qwen 72B', features: ['Todo Plus', 'Respuestas largas', 'Análisis profundo'] }
        ];
        const container = document.getElementById('tierCards');
        container.innerHTML = tiers.map(t => `
            <div class="tier-card ${state.userTier === t.id ? 'current' : ''}" onclick="upgradeTier('${t.id}')">
                <div class="tier-card-header">
                    <span class="tier-card-name">${t.name}</span>
                    <span class="tier-card-price">${t.price}</span>
                </div>
                <ul class="tier-card-features">
                    <li>${t.limit}</li>
                    <li>${t.models}</li>
                    ${t.features.map(f => `<li>${f}</li>`).join('')}
                </ul>
            </div>
        `).join('');
    }

    async function upgradeTier(newTier) {
        if (newTier === state.userTier) { showToast('Ya estás en este plan', 'info'); return; }
        try {
            const res = await fetch(`${API_BASE_URL}/upgrade-tier/${encodeURIComponent(state.userEmail)}?new_tier=${newTier}`, { method: 'POST' });
            if (res.ok) {
                showToast(`Plan actualizado a ${newTier.toUpperCase()}`, 'success');
                await loadUserConfig();
            } else {
                const err = await res.json().catch(() => ({}));
                showToast(err.detail || 'Error al actualizar', 'error');
            }
        } catch (e) { showToast('Error de red', 'error'); }
    }

    function toggleModelSelector() {
        document.getElementById('modelDropdown').classList.toggle('show');
        document.getElementById('agentDropdown').classList.remove('show');
    }

    function toggleAgentSelector() {
        document.getElementById('agentDropdown').classList.toggle('show');
        document.getElementById('modelDropdown').classList.remove('show');
    }

    function selectModel(modelId) {
        state.currentModelId = modelId;
        document.getElementById('currentModel').innerText = MODELS_CATALOG[modelId]?.name || modelId;
        renderModelDropdown();
        toggleModelSelector();
        showToast(`Modelo: ${MODELS_CATALOG[modelId]?.name || modelId}`, 'info');
    }

    function selectAgent(agentId) {
        state.currentAgentId = agentId;
        document.getElementById('currentAgent').innerText = formatAgentName(agentId);
        renderAgentDropdown();
        toggleAgentSelector();
        showToast(`Agente: ${formatAgentName(agentId)}`, 'info');
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-actions')) {
            document.getElementById('modelDropdown').classList.remove('show');
            document.getElementById('agentDropdown').classList.remove('show');
        }
        if (!e.target.closest('.message-actions-bar')) {
            document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('show'));
        }
    });
</script>
</body>
</html>
