<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ApoloXia Pro | Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --pure-black: #000000;
            --near-black: #050505;
            --dark-gray: #0a0a0a;
            --medium-gray: #111111;
            --light-gray: #1a1a1a;
            --border-gray: #222222;
            --hover-gray: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #666666;
            --accent-gold: #d4af37;
            --accent-gold-light: #f0d878;
            --accent-gold-dark: #b8941f;
            --accent-gold-glow: rgba(212, 175, 55, 0.12);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --glass: rgba(255,255,255,0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--pure-black);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-gray); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

        .app { display: flex; height: 100vh; width: 100vw; }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 320px;
            background: var(--near-black);
            border-right: 1px solid var(--border-gray);
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-gray);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 50%, var(--accent-gold) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--pure-black);
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .sidebar-brand {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .sidebar-brand span {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .new-chat-btn {
            margin: 16px 16px 8px;
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 50%, var(--accent-gold) 100%);
            border: none;
            border-radius: 14px;
            color: var(--pure-black);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.35);
        }

        .sidebar-section-title {
            padding: 16px 20px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
        }

        .conversation-item {
            padding: 12px 14px;
            margin: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            position: relative;
            border: 1px solid transparent;
        }
        .conversation-item:hover { background: var(--light-gray); }
        .conversation-item.active {
            background: var(--accent-gold-glow);
            border-color: rgba(212, 175, 55, 0.25);
        }
        .conversation-item.active .conv-title { color: var(--accent-gold-light); }

        .conv-icon {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: var(--light-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            border: 1px solid var(--border-gray);
        }

        .conv-info { flex: 1; min-width: 0; }
        .conv-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .conv-delete {
            opacity: 0;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .conversation-item:hover .conv-delete { opacity: 1; }
        .conv-delete:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-gray);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 14px;
            background: var(--light-gray);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border-gray);
        }
        .user-profile:hover { background: var(--hover-gray); border-color: var(--accent-gold); }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--pure-black);
            flex-shrink: 0;
        }

        .user-info { flex: 1; min-width: 0; }
        .user-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-tier {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .tier-free { color: var(--text-muted); }
        .tier-plus { color: var(--accent-gold); }
        .tier-gt { color: var(--accent-purple); }

        /* ========== MAIN ========== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--pure-black);
        }

        .chat-header {
            height: 64px;
            border-bottom: 1px solid var(--border-gray);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            z-index: 50;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
        }
        .menu-toggle:hover { background: var(--light-gray); color: var(--text-primary); }

        .header-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .header-btn {
            padding: 8px 14px;
            background: var(--light-gray);
            border: 1px solid var(--border-gray);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .header-btn:hover {
            background: var(--hover-gray);
            color: var(--text-primary);
            border-color: var(--accent-gold);
        }
        .header-btn.active {
            background: var(--accent-gold-glow);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        /* ========== MESSAGES ========== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            scroll-behavior: smooth;
        }

        .messages-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Welcome Banner */
        .welcome-banner {
            text-align: center;
            padding: 50px 20px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 50%, var(--accent-gold) 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--pure-black);
            margin: 0 auto 24px;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.4);
            animation: welcomePulse 3s ease-in-out infinite;
        }

        @keyframes welcomePulse {
            0%, 100% { box-shadow: 0 0 60px rgba(212,175,55,0.4); }
            50% { box-shadow: 0 0 100px rgba(212,175,55,0.7); }
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .welcome-title .gold {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .welcome-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 36px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            max-width: 750px;
            margin: 0 auto;
        }

        .quick-action {
            padding: 18px;
            background: var(--light-gray);
            border: 1px solid var(--border-gray);
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }
        .quick-action:hover {
            background: var(--hover-gray);
            border-color: var(--accent-gold);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .quick-action-icon { font-size: 1.6rem; margin-bottom: 10px; }
        .quick-action-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .quick-action-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ========== USER MESSAGE (CON RECUADRO) ========== */
        .message.user {
            display: flex;
            flex-direction: row-reverse;
            gap: 12px;
            margin-bottom: 32px;
            animation: messageIn 0.4s ease;
        }

        .message.user .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            color: var(--pure-black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .message.user .message-content {
            max-width: 75%;
            padding: 14px 20px;
            background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(212,175,55,0.04));
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            border-bottom-right-radius: 4px;
            color: var(--text-primary);
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
        }

        /* ========== ASSISTANT MESSAGE (SIN RECUADRO - ESTILO LIBRE) ========== */
        .message.assistant {
            display: flex;
            gap: 14px;
            margin-bottom: 40px;
            animation: messageIn 0.5s ease;
        }

        .message.assistant .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--light-gray);
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.assistant .message-body {
            flex: 1;
            max-width: 100%;
        }

        .message.assistant .message-content {
            color: var(--text-primary);
            font-size: 0.97rem;
            line-height: 1.8;
            word-wrap: break-word;
        }

        /* Estilos para el contenido enriquecido del asistente */
        .message.assistant .message-content h1,
        .message.assistant .message-content h2,
        .message.assistant .message-content h3 {
            margin: 24px 0 12px 0;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .message.assistant .message-content h1 { font-size: 1.5rem; border-bottom: 1px solid var(--border-gray); padding-bottom: 8px; }
        .message.assistant .message-content h2 { font-size: 1.25rem; color: var(--accent-gold-light); }
        .message.assistant .message-content h3 { font-size: 1.1rem; color: var(--text-secondary); }

        .message.assistant .message-content p {
            margin-bottom: 14px;
            color: var(--text-secondary);
        }

        .message.assistant .message-content ul,
        .message.assistant .message-content ol {
            margin: 12px 0 12px 20px;
            color: var(--text-secondary);
        }
        .message.assistant .message-content li {
            margin-bottom: 8px;
            line-height: 1.7;
        }

        .message.assistant .message-content strong {
            color: var(--accent-gold-light);
            font-weight: 600;
        }

        .message.assistant .message-content blockquote {
            border-left: 3px solid var(--accent-gold);
            margin: 16px 0;
            padding: 12px 20px;
            background: var(--accent-gold-glow);
            border-radius: 0 12px 12px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .message.assistant .message-content hr {
            border: none;
            border-top: 1px solid var(--border-gray);
            margin: 24px 0;
        }

        .message.assistant .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.9rem;
        }
        .message.assistant .message-content th,
        .message.assistant .message-content td {
            padding: 10px 14px;
            border: 1px solid var(--border-gray);
            text-align: left;
        }
        .message.assistant .message-content th {
            background: var(--light-gray);
            color: var(--accent-gold);
            font-weight: 600;
        }
        .message.assistant .message-content tr:nth-child(even) {
            background: rgba(255,255,255,0.02);
        }

        /* Code blocks */
        .code-block {
            background: var(--near-black);
            border: 1px solid var(--border-gray);
            border-radius: 14px;
            margin: 16px 0;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--dark-gray);
            border-bottom: 1px solid var(--border-gray);
        }

        .code-lang {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .code-actions {
            display: flex;
            gap: 6px;
        }

        .code-copy, .code-run {
            padding: 5px 12px;
            background: var(--light-gray);
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .code-copy:hover, .code-run:hover {
            background: var(--accent-gold-glow);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .code-block pre {
            padding: 18px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        .code-block code {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Inline code */
        .message.assistant .message-content code:not(pre code) {
            background: var(--light-gray);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88em;
            color: var(--accent-gold-light);
            border: 1px solid var(--border-gray);
        }

        /* Mermaid diagrams */
        .mermaid-container {
            background: var(--near-black);
            border: 1px solid var(--border-gray);
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            text-align: center;
            overflow: auto;
        }
        .mermaid {
            display: inline-block;
        }

        /* Math formulas */
        .katex-display {
            margin: 16px 0;
            overflow-x: auto;
            padding: 12px;
            background: var(--near-black);
            border-radius: 12px;
            border: 1px solid var(--border-gray);
        }

        /* Feature badges */
        .feature-badges {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .feature-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-web { background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.25); color: var(--accent-blue); }
        .badge-multi { background: rgba(139, 92, 246, 0.12); border: 1px solid rgba(139, 92, 246, 0.25); color: var(--accent-purple); }
        .badge-agent { background: rgba(212, 175, 55, 0.12); border: 1px solid rgba(212, 175, 55, 0.25); color: var(--accent-gold); }
        .badge-model { background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.25); color: var(--accent-green); }

        /* Message meta & actions */
        .message-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border-gray);
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .message-actions-bar {
            display: flex;
            gap: 6px;
        }

        .msg-action-btn {
            padding: 6px 12px;
            background: var(--light-gray);
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .msg-action-btn:hover {
            background: var(--hover-gray);
            color: var(--text-primary);
            border-color: var(--accent-gold);
        }

        /* Share menu */
        .share-menu {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 8px;
            background: var(--near-black);
            border: 1px solid var(--border-gray);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 180px;
            z-index: 100;
        }
        .share-menu.show { display: flex; animation: dropdownIn 0.2s ease; }

        .share-option {
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .share-option:hover { background: var(--light-gray); color: var(--text-primary); }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 16px 20px;
            background: var(--light-gray);
            border: 1px solid var(--border-gray);
            border-radius: 18px;
            width: fit-content;
            margin-bottom: 24px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-gold);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ========== INPUT ========== */
        .input-container {
            padding: 16px 24px 24px;
            background: linear-gradient(to top, var(--pure-black) 70%, transparent);
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--medium-gray);
            border: 1px solid var(--border-gray);
            border-radius: 24px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .input-box:focus-within {
            border-color: var(--accent-gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.08);
        }

        .input-textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 200px;
            min-height: 24px;
            line-height: 1.5;
        }
        .input-textarea::placeholder { color: var(--text-muted); }

        .input-actions { display: flex; gap: 6px; align-items: center; }

        .input-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            position: relative;
        }
        .input-btn:hover { background: var(--light-gray); color: var(--text-primary); }
        .input-btn.active { color: var(--accent-gold); background: var(--accent-gold-glow); }

        .input-btn.send {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            color: var(--pure-black);
        }
        .input-btn.send:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
        }
        .input-btn.send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .file-input { display: none; }

        .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding: 0 10px;
        }

        .input-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .input-hint span {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .remaining-badge {
            font-size: 0.7rem;
            padding: 5px 12px;
            background: var(--light-gray);
            border-radius: 20px;
            color: var(--text-secondary);
            font-weight: 600;
            border: 1px solid var(--border-gray);
        }
        .remaining-badge.low {
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* ========== DROPDOWNS ========== */
        .model-dropdown, .agent-dropdown {
            position: absolute;
            bottom: 100%;
            left: 0;
            margin-bottom: 10px;
            background: var(--near-black);
            border: 1px solid var(--border-gray);
            border-radius: 16px;
            padding: 8px;
            min-width: 300px;
            max-height: 420px;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: none;
            z-index: 200;
        }
        .model-dropdown.show, .agent-dropdown.show {
            display: block;
            animation: dropdownIn 0.2s ease;
        }

        @keyframes dropdownIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-header {
            padding: 10px 12px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .model-option, .agent-option {
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }
        .model-option:hover, .agent-option:hover { background: var(--light-gray); }
        .model-option.selected, .agent-option.selected {
            background: var(--accent-gold-glow);
            border-color: rgba(212, 175, 55, 0.25);
        }

        .model-option .model-name {
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .model-option .model-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .tier-tag {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .tag-free { background: var(--light-gray); color: var(--text-muted); }
        .tag-plus { background: rgba(212, 175, 55, 0.15); color: var(--accent-gold); }
        .tag-gt { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }

        /* ========== SETTINGS ========== */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .settings-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .settings-panel {
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            background: var(--near-black);
            border: 1px solid var(--border-gray);
            border-radius: 24px;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .settings-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-gray);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .settings-title { font-size: 1.15rem; font-weight: 700; }

        .settings-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .settings-close:hover { background: var(--light-gray); color: var(--text-primary); }

        .settings-body {
            padding: 20px 24px;
            overflow-y: auto;
            max-height: 65vh;
        }

        .setting-item { margin-bottom: 28px; }
        .setting-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }

        .tier-cards { display: grid; gap: 12px; }

        .tier-card {
            padding: 18px;
            border: 2px solid var(--border-gray);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tier-card:hover { border-color: var(--accent-gold); }
        .tier-card.current {
            border-color: var(--accent-gold);
            background: var(--accent-gold-glow);
        }

        .tier-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .tier-card-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .tier-card-price {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-gold);
        }
        .tier-card-features {
            font-size: 0.82rem;
            color: var(--text-secondary);
            list-style: none;
        }
        .tier-card-features li {
            padding: 3px 0;
            padding-left: 18px;
            position: relative;
        }
        .tier-card-features li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--accent-gold);
            font-weight: 700;
        }

        /* ========== TOAST ========== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 14px 20px;
            background: var(--near-black);
            border: 1px solid var(--border-gray);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: toastIn 0.3s ease;
            max-width: 380px;
            backdrop-filter: blur(10px);
        }

        @keyframes toastIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success { border-left: 3px solid var(--accent-green); }
        .toast.error { border-left: 3px solid var(--accent-red); }
        .toast.warning { border-left: 3px solid var(--accent-orange); }
        .toast.info { border-left: 3px solid var(--accent-blue); }

        /* ========== FILE UPLOAD PREVIEW ========== */
        .file-preview {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--light-gray);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .file-preview.show { display: flex; }
        .file-preview .remove-file {
            margin-left: auto;
            cursor: pointer;
            color: var(--accent-red);
            font-weight: 700;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            .message.user .message-content { max-width: 90%; }
            .message.assistant .message-body { max-width: 100%; }
            .welcome-title { font-size: 1.6rem; }
            .quick-actions { grid-template-columns: 1fr; }
            .header-actions { display: none; }
            .messages-wrapper { padding: 0 16px; }
        }

        /* Animations */
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Concept map / study card styles */
        .concept-card {
            background: linear-gradient(135deg, var(--light-gray), var(--medium-gray));
            border: 1px solid var(--border-gray);
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
        }
        .concept-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .concept-card-content {
            color: var(--text-secondary);
            line-height: 1.8;
        }
    </style>
<base target="_blank">

<script>
    // ========== CONFIGURACIÓN GLOBAL ==========
    const API_BASE_URL = '';
    let state = {
        userEmail: '',
        userName: '',
        userTier: 'free',
        remainingDaily: 100,
        maxDaily: 100,
        conversationId: null,
        conversations: [],
        currentModelId: null,
        currentAgentId: 'general',
        webSearchEnabled: false,
        multiAgentEnabled: false,
        isTyping: false,
        availableModels: [],
        availableAgents: [],
        tierConfig: null,
        uploadedFile: null
    };
    let MODELS_CATALOG = {};
    let AGENTS_CATALOG = {};

    // ========== INICIALIZACIÓN ==========
    document.addEventListener('DOMContentLoaded', initApp);

    async function initApp() {
        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'dark',
            themeVariables: {
                primaryColor: '#1a1a1a',
                primaryTextColor: '#ffffff',
                primaryBorderColor: '#d4af37',
                lineColor: '#d4af37',
                secondaryColor: '#111111',
                tertiaryColor: '#0a0a0a'
            }
        });

        const savedEmail = localStorage.getItem('apoloxia_session_email');
        if (!savedEmail) {
            window.location.href = 'index.html';
            return;
        }
        state.userEmail = savedEmail;
        state.userName = savedEmail.split('@')[0];
        updateUserUI();

        await loadUserConfig();
        await loadConversations();
        renderWelcomeBanner();
        focusInput();
    }

    function updateUserUI() {
        document.getElementById('userName').innerText = state.userName;
        document.getElementById('userAvatar').innerText = state.userName.charAt(0).toUpperCase();
        document.getElementById('settingsEmail').innerText = state.userEmail;
        const tierEl = document.getElementById('userTier');
        tierEl.innerText = state.userTier.toUpperCase();
        tierEl.className = 'user-tier tier-' + state.userTier.toLowerCase();
    }

    // ========== CONFIGURACIÓN DE USUARIO ==========
    async function loadUserConfig() {
        try {
            const res = await fetch(`${API_BASE_URL}/user-config/${encodeURIComponent(state.userEmail)}`);
            if (!res.ok) {
                if (res.status === 404) {
                    applyDefaultConfig();
                    return;
                }
                throw new Error(`Error ${res.status}`);
            }
            const data = await res.json();
            applyConfig(data);
        } catch (err) {
            showToast('Error cargando configuración, usando valores por defecto', 'warning');
            applyDefaultConfig();
        }
    }

    function applyConfig(data) {
        state.userTier = data.tier || 'free';
        state.remainingDaily = data.remaining_daily || 100;
        state.maxDaily = data.max_daily_responses || 100;
        state.availableModels = data.available_models || [];
        state.availableAgents = data.available_agents || [];
        state.tierConfig = data;

    async function deleteConversation(convId) {
        try {
            const res = await fetch(`${API_BASE_URL}/conversations/${encodeURIComponent(state.userEmail)}/${convId}`, { method: 'DELETE' });
            if (res.ok) {
                state.conversations = state.conversations.filter(c => c.conversation_id !== convId);
                if (state.conversationId === convId) startNewChat();
                renderConversationList();
                showToast('Conversación eliminada', 'success');
            }
        } catch (err) {
            showToast('Error al eliminar', 'error');
        }
    }

        focusInput();

    // ========== ENVÍO DE MENSAJES ==========
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message || state.isTyping) return;

        input.value = '';
        input.style.height = 'auto';

        if (!state.conversationId) {
            state.conversationId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
        }

        addMessageToUI('user', escapeHtml(message));
        showTypingIndicator();
        state.isTyping = true;
        updateSendButton();

        try {
            const payload = {
                user_id: state.userEmail,
                conversation_id: state.conversationId,
                message: message,
                tier: state.userTier,
                agent_type: state.currentAgentId,
                model_id: state.currentModelId,
                use_web_search: state.webSearchEnabled,
                enable_multi_agent: state.multiAgentEnabled,
                file_content: state.uploadedFile
            };

            const res = await fetch(`${API_BASE_URL}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const errorData = await res.json().catch(() => ({}));
                throw new Error(errorData.detail || `Error ${res.status}`);
            }

            const data = await res.json();
            hideTypingIndicator();

            let responseContent = data.response || 'Sin respuesta';

            // Renderizar badges de features
            let badgesHtml = '';
            if (data.web_search_used) {
                badgesHtml += '<span class="feature-badge badge-web">🔍 Web</span>';
            }
            if (data.multi_agent_responses && data.multi_agent_responses.length > 0) {
                badgesHtml += '<span class="feature-badge badge-multi">🤖 Multi</span>';
            }
            badgesHtml += `<span class="feature-badge badge-agent">👤 ${formatAgentName(data.agent_used)}</span>`;
            badgesHtml += `<span class="feature-badge badge-model">🧠 ${data.model_used}</span>`;

            addAssistantMessage(responseContent, badgesHtml);
            state.remainingDaily = data.remaining_daily;
            updateRemainingBadge();
            await loadConversations();
        } catch (err) {
            hideTypingIndicator();
            addMessageToUI('assistant', `❌ **Error:** ${escapeHtml(err.message)}`);
            showToast(err.message, 'error');
        } finally {
            state.isTyping = false;
            updateSendButton();
            removeFile();
        }
    }

    function addMessageToUI(role, content) {

        const avatar = role === 'user' ? state.userName.charAt(0).toUpperCase() : '⚡';

        } else {

                    <div class="message-content">${content}</div>
                    <div class="message-meta-row">
                        <span class="message-time">${time}</span>
                    </div>

            `;
        }
        wrapper.appendChild(div);
        scrollToBottom();
    }

    function addAssistantMessage(markdownContent, badgesHtml = '') {
        const wrapper = document.getElementById('messagesWrapper');
        const div = document.createElement('div');
        div.className = 'message assistant';
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const msgId = 'msg-' + Date.now();

        div.innerHTML = `
            <div class="message-avatar">⚡</div>
            <div class="message-body">
                <div class="feature-badges">${badgesHtml}</div>
                <div class="message-content" id="${msgId}"></div>
                <div class="message-meta-row">
                    <span class="message-time">${time}</span>
                    <div class="message-actions-bar">
                        <button class="msg-action-btn" onclick="copyMessage('${msgId}')">📋 Copiar</button>
                        <button class="msg-action-btn" onclick="regenerateLastMessage()">🔄 Regenerar</button>
                        <div style="position:relative;">
                            <button class="msg-action-btn" onclick="toggleShareMenu(this)">📤 Compartir</button>
                            <div class="share-menu">
                                <div class="share-option" onclick="shareTo('whatsapp', '${msgId}')">📱 WhatsApp</div>
                                <div class="share-option" onclick="shareTo('twitter', '${msgId}')">🐦 Twitter/X</div>
                                <div class="share-option" onclick="shareTo('telegram', '${msgId}')">✈️ Telegram</div>
                                <div class="share-option" onclick="shareTo('linkedin', '${msgId}')">💼 LinkedIn</div>
                                <div class="share-option" onclick="shareTo('email', '${msgId}')">📧 Email</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        wrapper.appendChild(div);

        // Renderizar markdown
        const contentEl = div.querySelector(`#${msgId}`);
        const htmlContent = marked.parse(markdownContent);
        contentEl.innerHTML = htmlContent;

        // Renderizar código con syntax highlighting básico
        contentEl.querySelectorAll('pre code').forEach((block) => {
            const pre = block.parentElement;
            const lang = block.className.replace('language-', '') || 'text';
            const header = document.createElement('div');
            header.className = 'code-header';
            header.innerHTML = `
                <span class="code-lang">${lang}</span>
                <div class="code-actions">
                    <button class="code-copy" onclick="copyCode(this)">📋 Copiar</button>
                </div>
            `;
            pre.parentNode.insertBefore(header, pre);
            pre.classList.add('code-block');
        });

        // Renderizar mermaid diagrams
        contentEl.querySelectorAll('.language-mermaid, .mermaid').forEach((el) => {
            const container = document.createElement('div');
            container.className = 'mermaid-container';
            const mermaidDiv = document.createElement('div');
            mermaidDiv.className = 'mermaid';
            mermaidDiv.textContent = el.textContent;
            container.appendChild(mermaidDiv);
            el.parentNode.replaceWith(container);
        });

        // Renderizar KaTeX
        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(contentEl, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\[', right: '\\]', display: true},
                    {left: '\\(', right: '\\)', display: false}
                ],
                throwOnError: false
            });
        }

        // Inicializar mermaid
        mermaid.init(undefined, div.querySelectorAll('.mermaid'));

        scrollToBottom();
    }

            const res = await fetch(`${API_BASE_URL}/share/links`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ platform, text })
            });
            const data = await res.json();
            const url = data[platform] || data.copy_text;
            if (platform === 'email') {
                window.location.href = url;
            } else {
                window.open(url, '_blank');
            }
            document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('show'));

        renderModelDropdown();
        toggleModelSelector();
        showToast(`🧠 Modelo: ${MODELS_CATALOG[modelId]?.name || modelId}`, 'info');
    }

    function selectAgent(agentId) {
        state.currentAgentId = agentId;
        document.getElementById('currentAgent').innerText = formatAgentName(agentId);
        renderAgentDropdown();
        toggleAgentSelector();
        showToast(`👤 Agente: ${formatAgentName(agentId)}`, 'info');
    }

    // Cerrar dropdowns al hacer click fuera
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-actions')) {
            document.getElementById('modelDropdown').classList.remove('show');
            document.getElementById('agentDropdown').classList.remove('show');
        }
        if (!e.target.closest('.message-actions-bar')) {
            document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('show'));
        }
    });
</script>
</body>
</html>
